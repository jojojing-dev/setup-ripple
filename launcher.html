<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Setup Ripple</title>
<style>
@font-face{font-family:'Chakra Petch';font-weight:600;font-style:normal;font-display:swap;src:url('fonts/ChakraPetch-SemiBold.ttf') format('truetype')}
@font-face{font-family:'Chakra Petch';font-weight:700;font-style:normal;font-display:swap;src:url('fonts/ChakraPetch-Bold.ttf') format('truetype')}
@font-face{font-family:'Titillium Web';font-weight:400;font-style:normal;font-display:swap;src:url('fonts/TitilliumWeb-Regular.ttf') format('truetype')}
@font-face{font-family:'Titillium Web';font-weight:600;font-style:normal;font-display:swap;src:url('fonts/TitilliumWeb-SemiBold.ttf') format('truetype')}
@font-face{font-family:'Share Tech Mono';font-weight:400;font-style:normal;font-display:swap;src:url('fonts/ShareTechMono-Regular.ttf') format('truetype')}
</style>
<style>
  :root{
    --bg:#141414; --panel:#1a1a1a; --line:#303030; --well:#0c0c0c; --well-line:#2a2a2a;
    --text:#f4f6f5; --prose:#c9cbd0; --lbl:#9a9a9a; --lbl-hi:#d6d8dc;
    --red:#e8112d; --navy2:#0458A3;
    --disp:'Chakra Petch',sans-serif; --body:'Titillium Web',system-ui,sans-serif;
  }
  *{box-sizing:border-box;margin:0;padding:0}
  html,body{height:100%}
  body{
    background:var(--bg);color:var(--text);font-family:var(--body);
    display:flex;flex-direction:column;align-items:center;justify-content:center;
    min-height:100vh;padding:40px 24px;position:relative;overflow:hidden;
  }
  body::before{
    content:'';position:absolute;inset:0;pointer-events:none;z-index:0;
    background:repeating-linear-gradient(-45deg, transparent 0, transparent 22px, rgba(255,255,255,.022) 22px, rgba(255,255,255,.022) 24px);
  }
  .wrap{position:relative;z-index:1;display:flex;flex-direction:column;align-items:center}

  .brand{
    display:inline-flex;align-items:center;background:var(--well);border:1px solid var(--well-line);
    border-radius:6px;box-shadow:inset 0 2px 6px rgba(0,0,0,.7);overflow:hidden;margin-bottom:10px;
  }
  .brand span{
    background:var(--red);color:#fff;padding:9px 16px;font-family:var(--disp);font-weight:700;
    font-size:26px;letter-spacing:.02em;text-transform:uppercase;
  }
  .ver{font-family:var(--disp);font-weight:600;font-size:12.5px;letter-spacing:.2em;color:var(--lbl);margin-bottom:18px}
  .tagline{color:var(--prose);font-size:15px;margin-bottom:40px;text-align:center;max-width:520px;line-height:1.55}
  .choose{font-family:var(--disp);font-weight:600;font-size:12.5px;letter-spacing:.2em;text-transform:uppercase;color:var(--lbl);margin-bottom:16px}

  .cards{display:flex;gap:20px;flex-wrap:wrap;justify-content:center}
  .card{
    position:relative;width:280px;text-align:left;cursor:pointer;
    background:linear-gradient(#1c1c1c,#161616);border:1px solid var(--line);border-radius:8px;
    box-shadow:inset 0 1px 0 rgba(255,255,255,.07),0 3px 0 #0a0a0a;
    padding:26px 24px 22px;display:flex;flex-direction:column;gap:9px;color:var(--text);
    transition:transform .06s,box-shadow .06s,border-color .1s;
  }
  .card::before{content:'';position:absolute;top:-1px;left:-1px;width:0;height:0;border-top:22px solid var(--red);border-right:22px solid transparent;border-radius:8px 0 0 0}
  .card:hover{border-color:var(--navy2)}
  .card:active{transform:translateY(3px);box-shadow:inset 0 1px 0 rgba(255,255,255,.03),0 0 0 #0a0a0a}
  .card:focus-visible{outline:2px solid var(--red);outline-offset:3px}
  .card .tag{font-family:var(--disp);font-weight:600;font-size:12px;letter-spacing:.14em;text-transform:uppercase;color:var(--lbl);padding-left:14px}
  .card h2{font-family:var(--disp);font-size:26px;font-weight:700;text-transform:uppercase;line-height:1;color:var(--text)}
  .card .games{color:var(--lbl-hi);font-size:15px;font-weight:600}
  .card p{color:var(--prose);font-size:14px;line-height:1.5}

  .foot{
    margin-top:42px;display:inline-flex;background:var(--well);border:1px solid var(--well-line);border-radius:6px;
    box-shadow:inset 0 2px 6px rgba(0,0,0,.7);padding:8px 14px;font-family:var(--disp);font-weight:600;
    font-size:12px;letter-spacing:.12em;text-transform:uppercase;color:var(--lbl);text-align:center;
  }
  @media (prefers-reduced-motion:reduce){ .card{transition:none} }
</style>
</head>
<body>

  <div class="wrap">
    <div class="brand"><span>Setup Ripple</span></div>
    <div class="ver">Version 2.0</div>
    <div class="tagline">Setup cause and effect, an in-game style engineer view, and driver requests, for two sim families. Pick the one you're racing.</div>

    <div class="choose">Choose your sim</div>
    <div class="cards">
      <button class="card" data-app="setup-ripple.html">
        <span class="tag">Kunos</span>
        <h2>ACC / AC Evo</h2>
        <span class="games">Assetto Corsa Competizione and Evo</span>
        <p>GT3 cause and effect, six-page setup view, compare, and driver requests for both Kunos sims.</p>
      </button>
      <button class="card" data-app="setup-ripple-lmu.html">
        <span class="tag">Le Mans Ultimate</span>
        <h2>LMU</h2>
        <span class="games">Hypercar &middot; LMP &middot; GT3</span>
        <p>Hypercar, LMP and GT3 cause and effect, six-page engineer view, hybrid energy tools, and Bono AI.</p>
      </button>
    </div>

    <div class="foot">One app, two sims &middot; switch anytime from the top bar</div>
  </div>

  <script>
    document.querySelectorAll('.card').forEach(c=>{
      c.addEventListener('click', ()=>{ window.location.href = c.dataset.app; });
    });
  </script>
</body>
</html>
