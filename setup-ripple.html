/* Read a field's value(s) from a loaded setup, ACC or Evo.
   Returns {field:{l}, cells:[{label,value,pid,path,idx}]}. */
function readField(setup, path){
  const f=fieldFor(path);
  if(!f) return null;
  const v=get(setup.json, path);
  if(v===undefined) return null;
  if(Array.isArray(v)){
    const cells=v.map((val,i)=>{
      const lab=f.c?(f.c[i]!==undefined?String(f.c[i]):String(i)):String(i);
      if(String(lab).includes('n/a')) return null;
      return {label:lab, value:fmt(val), rawValue:val, pid:pidFor(f,i), path, idx:i};
    }).filter(Boolean);
    return {field:f, cells};
  }
  return {field:f, cells:[{label:null, value:fmt(v), rawValue:v, pid:pidFor(f,null), path, idx:null}]};
}

/* Nudge controls (◄ ►) + pending badge for an adjustable field.
   locator uniquely ids the field within the setup:
     ACC: {kind:'acc', path, idx}   Evo: {kind:'evo', key, off} */
function nudgeCtl(locator, label){
  const id = nudgeId(locator);
  const pend = pendingNudge[id] ? pendingNudge[id].steps : 0;
  const badge = `<span class="eng-pend">${pend!==0?(pend>0?'+':'')+pend:''}</span>`;
  const enc = encodeURIComponent(JSON.stringify(locator));
  return `<span class="eng-nudge">${badge}`+
    `<button class="nbtn" data-loc="${enc}" data-lbl="${esc(label)}" data-d="-1" title="One click down">◄</button>`+
    `<button class="nbtn" data-loc="${enc}" data-lbl="${esc(label)}" data-d="1" title="One click up">►</button></span>`;
}
function nudgeId(loc){
  return loc.kind==='acc' ? `acc:${loc.path}:${loc.idx==null?'':loc.idx}` : `evo:${loc.key}`;
}
function nudge(locator, label, delta){
  const id = nudgeId(locator);
  const cur = pendingNudge[id] ? pendingNudge[id].steps : 0;
  const steps = cur + delta;
  if(steps===0) delete pendingNudge[id];
  else pendingNudge[id] = { steps, label, locator };
  renderEng();
}
function nudgeCount(){ return Object.keys(pendingNudge).length; }
function clearNudges(){ pendingNudge={}; renderEng(); }

/* Build an edited file from pending nudges. ACC → edited json; Evo → edited bytes.
   Only the nudged fields change; everything else stays identical (lossless for Evo). */
function applyNudges(setup){
  if(setup.kind==='evo'){
    const bytes=new Uint8Array(setup.bytes);
    const dv=new DataView(bytes.buffer);
    for(const id in pendingNudge){
      const e=pendingNudge[id]; const loc=e.locator;
      if(loc.kind!=='evo' || loc.step==null || loc.off==null) continue;
      const node=setup.flat[loc.key]; if(!node) continue;
      const newVal=node.v + e.steps*loc.step;
      dv.setFloat32(loc.off, newVal, true);
    }
    return bytes;
  }else{
    const j=JSON.parse(JSON.stringify(setup.json));
    for(const id in pendingNudge){
      const e=pendingNudge[id]; const loc=e.locator;
      if(loc.kind!=='acc') continue;
      const cur=get(j, loc.path);
      if(loc.idx!=null && Array.isArray(cur)){ cur[loc.idx]=cur[loc.idx]+e.steps; }
      else{
        const parts=loc.path.split('.'), last=parts.pop();
        const obj=get(j,parts.join('.')); if(obj) obj[last]=obj[last]+e.steps;
      }
    }
    return j;
  }
}

      const w=await fh.createWritable(); await w.write(payload); await w.close(); await ok(newName); return;
    }catch(e){ console.warn('Handle save failed:',e); }
  }
  // Download fallback
  const a=document.createElement('a');
  a.href=URL.createObjectURL(new Blob([payload],{type:isEvo?'application/octet-stream':'application/json'}));
  a.download=newName; a.click();
  if(msg) msg.innerHTML=`<b>Downloaded</b> ${esc(newName)}. Drop it into your setups folder.`;
}


function renderViewSetup(setup){
  if(!setup) return `<p class="eng-empty">Choose Setup A above to view it page by page.</p>`;
  const PAGES = setup.kind==='evo' ? EVO_PAGES : ACC_PAGES;
  const tabs = PAGES.map(pg=>
    `<button class="vpage ${engPage===pg.id?'on':''}" data-vp="${pg.id}">${pg.name}</button>`).join('');
  const page = PAGES.find(p=>p.id===engPage) || PAGES[0];
  let body;
  if(setup.kind==='evo'){
    body = page.groups.map(g=>{
      let rows='';
      if(g.corner){
        // one row per key-template, cells per corner
        rows = g.keys.map(tmpl=>{
          const cells=EVO_CORNERS.map((cn,ci)=>{
            const key=tmpl.replace('[C]','['+ci+']');
            const node=setup.flat[key]; if(!node) return null;
            const step=nudgeStepEVO(key, node);
            const loc={kind:'evo', key, off:node.off, step};
            const id=nudgeId(loc);
            const steps=pendingNudge[id]?pendingNudge[id].steps:0;
            const shownVal=node.v + (step?steps*step:0);
            const ctl = step!=null ? nudgeCtl(loc, cn) : '';
            return `<span class="vcell"><span class="vcl">${cn}</span><span class="vcv">${esc(String(fmt(shownVal)))}</span>${ctl}</span>`;
          }).filter(Boolean).join('');
          if(!cells) return '';
          const m=EVO_MAP[tmpl.replace('[C]','[0]')];
          const lbl=(m?m.l.replace(/, LF$/,''):(g.label||tmpl));
          return `<div class="vrow"><span class="vlabel">${esc(lbl)}</span><span class="vcells">${cells}</span></div>`;
        }).join('');
      }else{
        rows = g.keys.map(key=>{
          const node=setup.flat[key]; if(!node) return '';
          const m=EVO_MAP[key];
          const lbl=m?m.l:key;
          const step=nudgeStepEVO(key, node);
          const loc={kind:'evo', key, off:node.off, step};
          const id=nudgeId(loc);
          const steps=pendingNudge[id]?pendingNudge[id].steps:0;
          const shownVal=node.v + (step?steps*step:0);
          const ctl = step!=null ? nudgeCtl(loc, lbl) : '';
          return `<div class="vrow"><span class="vlabel">${esc(lbl)}</span><span class="vcells"><span class="vcell"><span class="vcv">${esc(String(fmt(shownVal)))}</span>${ctl}</span></span></div>`;
        }).join('');
      }
      return rows ? `<div class="vgroup"><h4>${esc(g.title)}</h4>${rows}</div>` : '';
    }).filter(Boolean).join('');
  }else{
    body = page.groups.map(g=>{
      const rows = g.paths.map(p=>{
        const r=readField(setup, p);
        if(!r) return '';
        const cells=r.cells.map(c=>{
          const loc={kind:'acc', path:c.path, idx:c.idx, step:1};
          const id=nudgeId(loc);
          const steps=pendingNudge[id]?pendingNudge[id].steps:0;
          // ACC values are integer clicks; show stepped preview
          const rawNum = typeof c.rawValue==='number'?c.rawValue:Number(c.value);
          const shown = (steps!==0 && !Number.isNaN(rawNum)) ? fmt(rawNum+steps) : c.value;
          const ctl = nudgeCtl(loc, c.label||r.field.l);
          return `<span class="vcell">${c.label?`<span class="vcl">${esc(c.label)}</span>`:''}<span class="vcv">${esc(String(shown))}</span>${ctl}</span>`;
        }).join('');
        return `<div class="vrow"><span class="vlabel">${esc(r.field.l)}</span><span class="vcells">${cells}</span></div>`;
      }).filter(Boolean).join('');
      return rows ? `<div class="vgroup"><h4>${esc(g.title)}</h4>${rows}</div>` : '';
    }).filter(Boolean).join('');
  }
  const note = setup.kind==='evo'
    ? `<p class="eng-status">AC Evo values are decoded to real physical units (psi, °, N/m, mm). Some fields are inferred from the file format. Cross-check against the in-game screen. Fields without ◄ ► are view-only (step not yet verified).</p>`
    : `<p class="eng-status">ACC values are setup-screen positions (clicks), exactly as the game shows them.</p>`;
  const saveBar = nudgeCount()
    ? `<div class="eng-actions" style="margin-top:14px">
         <button class="btn primary" id="btnSaveNudge">Save edited setup (${nudgeCount()} change${nudgeCount()>1?'s':''})</button>
         <button class="btn" id="btnClearNudge">Clear changes</button>
         <span id="nudgeMsg" class="eng-status"></span>
       </div>`
    : '';
  return `<div class="vpages" role="tablist">${tabs}</div>${note}<div class="vbody">${body||'<p class="eng-empty">No fields on this page for this setup.</p>'}</div>${saveBar}`;
}



/* Post-render: any row with exactly LF/RF/LR/RR cells becomes a corner diagram. */
function applyCornerDiagrams(root){
  root.querySelectorAll('.vrow').forEach(row=>{
    const cells=[...row.querySelectorAll('.vcells > .vcell')];
    if(cells.length!==4) return;
    const labs=cells.map(c=>(c.querySelector('.vcl')||{}).textContent||'');
    const order=['LF','RF','LR','RR'];
    if(!order.every(o=>labs.includes(o))) return;
    const wrap=document.createElement('div'); wrap.className='cd';
    const byLab={}; cells.forEach((c,i)=>{ byLab[labs[i]]=c; });
    const pos={LF:'fl',RF:'fr',LR:'rl',RR:'rr'};
    // group each cell's value + nudge into a .cd-val so the label sits above them
    order.forEach(o=>{
      const c=byLab[o]; c.classList.add(pos[o]);
      const val=document.createElement('span'); val.className='cd-val';
      [...c.childNodes].forEach(n=>{ if(!(n.classList&&n.classList.contains('vcl'))) val.appendChild(n); });
      c.appendChild(val);
    });
    wrap.appendChild(byLab.LF); wrap.appendChild(byLab.RF);
    wrap.appendChild(byLab.LR); wrap.appendChild(byLab.RR);
    const old=row.querySelector('.vcells'); old.replaceWith(wrap); row.classList.add('has-cd');
  });
  // glow any value that carries a pending change
  root.querySelectorAll('.vcell').forEach(c=>{
    const p=c.querySelector('.eng-pend'); const v=c.querySelector('.vcv');
    if(p&&v&&p.textContent.trim()) v.classList.add('changed');
  });
}

function parseLapTime(s){
  if(!s) return null;
  s=String(s).trim();
  if(s.includes(':')){
    const [m,sec]=s.split(':');
    const mm=parseFloat(m), ss=parseFloat(sec);
    if(isNaN(mm)||isNaN(ss)) return null;
    return mm*60+ss;
  }
  const v=parseFloat(s);
  return isNaN(v)?null:v;
}

function renderFuelOut(){
  const out=document.getElementById('fuelOut');
  if(!out) return;
  const perLap=fuel.perLap;
  let laps;
  if(fuel.unit==='laps'){
    laps=Math.ceil(fuel.length);
  }else{
    const lt=parseLapTime(fuel.lapTime);
    if(!lt||lt<=0){
      out.innerHTML=`<p class="fuel-warn">Enter a valid lap time (e.g. 1:45) to convert ${fuel.length} minutes into laps.</p>`;
      return;
    }
    laps=Math.ceil((fuel.length*60)/lt);
  }
  const formationLaps=fuel.formation?1:0;
  const totalLaps=laps+formationLaps+fuel.margin;
  const litres=perLap*totalLaps;
  const need=Math.ceil(litres);
  if(perLap<=0||totalLaps<=0){
    out.innerHTML=`<p class="fuel-warn">Enter fuel per lap and race length to calculate.</p>`;
    return;
  }
  out.innerHTML=`
    <div class="big">${need}<span> L</span></div>
    <div class="line"><span>Racing laps</span><b>${laps}</b></div>
    ${formationLaps?`<div class="line"><span>Formation lap</span><b>+${formationLaps}</b></div>`:''}
    ${fuel.margin?`<div class="line"><span>Safety margin</span><b>+${fuel.margin} lap${fuel.margin===1?'':'s'}</b></div>`:''}
    <div class="line"><span>Total laps fuelled</span><b>${totalLaps}</b></div>
    <div class="line"><span>Exact need</span><b>${litres.toFixed(1)} L</b></div>
    <p class="fuel-warn">Rounded up to ${need} L. Carrying spare fuel adds weight. Trim the margin for quali or sprints.</p>`;
}

/* ─────────────────────── Bono AI ───────────────────────
   Bridge contract (provided by Electron preload, window.SetupRippleAI):
   • available() -> Promise<{ok:true} | {ok:false, reason:string}>
       (also tolerated: a plain boolean, or a non-Promise value)
   • send(prompt, { allowWrite, onChunk, onDone, onError })
       streaming callback model:
         onChunk(text)   – called repeatedly as output streams
         onDone(fullText)– called once on clean completion
         onError(message)– called on failure
       allowWrite (bool, default false) – when false the bridge prepends
         a read-only instruction so Bono never edits files without approval.
       (also tolerated: send() returning Promise<fullText> instead of streaming)
   The folder-picker bridge is window.SetupRippleDir.pick(), NOT
   showDirectoryPicker, which is a reserved browser name contextBridge
   refuses to bind over (that collision blocked SetupRippleAI entirely).
──────────────────────────────────────────────────────── */
function AI(){ return window.SetupRippleAI || null; }

/* ---- Bono setup picker: derive car / track / setup from loaded setups ----
   Setup labels look like "GT3 / Audi / audi_spa.carsetup" (folder relPath) or
   just a filename. We split on " / ". Last part is the setup, the part before
   it the track, and anything earlier joined as the car/category path. This is
   purely a naming aid: it inserts a clear reference into the message so both
   you and Bono know exactly which setup you mean. Bono reads the files itself. */
function spParts(label){
  const segs=String(label).split(' / ').map(s=>s.trim()).filter(Boolean);
  const setup=segs.length?segs[segs.length-1]:label;
  const track=segs.length>=2?segs[segs.length-2]:'';
  const car  =segs.length>=3?segs.slice(0,segs.length-2).join(' / '):'';
  return {car,track,setup};
}
function spCars(){
  return [...new Set(aiSetups.map(s=>s.car).filter(Boolean))].sort();
}
function spTracks(car){
  return [...new Set(aiSetups.filter(s=>s.car===car).map(s=>s.track).filter(Boolean))].sort();
}
function spSetups(car,track){
  return aiSetups.filter(s=>s.car===car&&s.track===track)
    .map(s=>s.setup).sort();
}
function spReference(){
  const bits=[];
  if(spCar) bits.push(spCar);
  if(spTrack) bits.push(spTrack);
  if(spSetup) bits.push(spSetup);
  return bits.join(' / ');
}
// Bono loads its own setup name list. Independent of the Engineer tab.
// Reuses the same bridge but only keeps the relPath labels (names, not file data).
async function aiPickFolder(){
  try{
    if(window.SetupRippleDir){
      const files = await window.SetupRippleDir.pick();
      aiSetups = files.map(f=>{
        const segs=String(f.relPath||f.name||'').split(' / ').map(s=>s.trim()).filter(Boolean);
        const setup=segs.length?segs[segs.length-1]:(f.name||'');
        const track=segs.length>=2?segs[segs.length-2]:'';
        let car='';
        try{
          if(f.isEvo && f.buffer){ const s=loadEvo(f.name,f.name,f.buffer,null); car=(s&&s.car)?s.car:(f.name||'').replace(/\.[^.]+$/,''); }
          else if(f.text!=null){ const j=JSON.parse(f.text); car=j.carName||''; }
        }catch(e){}
        return { car:car||'Unknown car', track, setup, relPath:f.relPath||f.name };
      }).filter(s=>s.setup).sort((a,b)=>a.setup.localeCompare(b.setup));
    }else if(window.showDirectoryPicker){
      const root=await window.showDirectoryPicker();
      const list=[];
      async function walk(dh,prefix,depth){
        if(depth>4) return;
        for await(const [name,h] of dh.entries()){
          if(h.kind==='directory') await walk(h,prefix?prefix+' / '+name:name,depth+1);
          else if(/\.(carsetup|setup|json)$/i.test(name)){
            const relPath=(prefix?prefix+' / ':'')+name;
            const segs=relPath.split(' / ').map(s=>s.trim()).filter(Boolean);
            const track=segs.length>=2?segs[segs.length-2]:'';
            let car='';
            try{ const file=await h.getFile();
              if(/\.(carsetup|setup)$/i.test(name)){ const buf=await file.arrayBuffer(); const s=loadEvo(name,name,buf,null); car=(s&&s.car)?s.car:name.replace(/\.[^.]+$/,''); }
              else{ const j=JSON.parse(await file.text()); car=j.carName||''; }
            }catch(e){}
            list.push({ car:car||'Unknown car', track, setup:name, relPath });
          }
        }
      }
      await walk(root,'',0);
      aiSetups=list.sort((a,b)=>a.setup.localeCompare(b.setup));
    }
    spCar=''; spTrack=''; spSetup='';
    if(mode==='ai') renderAI();
  }catch(e){
    if(e && e.name!=='AbortError') console.warn('Bono folder load failed:', e);
  }
}

        <span class="sp-label">Setup</span>
        <select id="spCar"><option value="">Car…</option>${spCars().map(c=>`<option value="${esc(c)}" ${c===spCar?'selected':''}>${esc(c)}</option>`).join('')}</select>
        <select id="spTrack" ${spCar?'':'disabled'}><option value="">Track…</option>${(spCar?spTracks(spCar):[]).map(t=>`<option value="${esc(t)}" ${t===spTrack?'selected':''}>${esc(t)}</option>`).join('')}</select>
        <select id="spSetup" ${spCar&&spTrack?'':'disabled'}><option value="">Setup…</option>${(spCar&&spTrack?spSetups(spCar,spTrack):[]).map(s=>`<option value="${esc(s)}" ${s===spSetup?'selected':''}>${esc(s)}</option>`).join('')}</select>
        <button id="spInsert" ${spSetup?'':'disabled'}>Insert →</button>
        <button id="spReload" title="Load a different folder">↻</button>`
        : `<button class="btn" id="spOpen">Open setups folder</button>
           <span class="sp-hint">Open your top-level setups folder (ACC: <b>Setups</b> · AC Evo: <b>Car Setups</b>) to pick a setup by car, track and name below. This is just a naming aid. Bono can already read your files; it makes clear which one you mean.</span>`
      }</div>
      <div class="chat-tools">
        <label title="When off (default), Bono can read and advise but never changes files without you ticking this first."><input type="checkbox" id="aiWrite" ${aiAllowWrite?'checked':''}> Allow Bono to edit setup files</label>
      </div>
      <div class="chat-input">
        <textarea id="aiInput" rows="2" placeholder="Ask your race engineer…" ${aiBusy?'disabled':''}></textarea>
        <button class="btn primary" id="aiSend" ${aiBusy?'disabled':''}>${aiBusy?'…':'Send'}</button>
      </div>
    </div>`;

  const log=document.getElementById('chatLog');
  if(log) log.scrollTop=log.scrollHeight;
  const wc=document.getElementById('aiWrite'); if(wc) wc.onchange=()=>{aiAllowWrite=wc.checked;};
  const input=document.getElementById('aiInput');
  const send=document.getElementById('aiSend');
  const doSend=()=>{ if(input && input.value.trim()) aiSendMsg(input.value.trim()); };
  if(send) send.onclick=doSend;
  if(input){
    input.onkeydown=e=>{ if(e.key==='Enter'&&!e.shiftKey){ e.preventDefault(); doSend(); } };
    input.oninput=()=>{ input.style.height='auto'; input.style.height=Math.min(input.scrollHeight,140)+'px'; };
    if(!aiBusy) input.focus();
  }
  main.querySelectorAll('[data-ex]').forEach(b=>b.onclick=()=>aiSendMsg(b.dataset.ex));
  // setup picker wiring (Bono-independent)
  const spOpen=document.getElementById('spOpen'); if(spOpen) spOpen.onclick=aiPickFolder;
  const spReload=document.getElementById('spReload'); if(spReload) spReload.onclick=aiPickFolder;
  const cSel=document.getElementById('spCar');
  const tSel=document.getElementById('spTrack');
  const sSel=document.getElementById('spSetup');
  if(cSel) cSel.onchange=()=>{ spCar=cSel.value; spTrack=''; spSetup=''; renderAI(); };
  if(tSel) tSel.onchange=()=>{ spTrack=tSel.value; spSetup=''; renderAI(); };
  if(sSel) sSel.onchange=()=>{ spSetup=sSel.value; renderAI(); };
  const ins=document.getElementById('spInsert');
  if(ins) ins.onclick=()=>{
    const ref=spReference();
    if(!ref) return;
    const inp=document.getElementById('aiInput');
    if(inp){
      const prefix=`Regarding my setup "${ref}": `;
      inp.value = inp.value ? (prefix+inp.value) : prefix;
      inp.focus();
      inp.style.height='auto'; inp.style.height=Math.min(inp.scrollHeight,140)+'px';
      inp.setSelectionRange(inp.value.length, inp.value.length);
    }
  };
}

function msgHTML(m){
  if(m.role==='user') return `<div class="msg user">${esc(m.text)}</div>`;
  if(m.role==='err') return `<div class="msg err">${esc(m.text)}</div>`;
  return `<div class="msg ai"><div class="who">Bono</div>${m.streaming&&!m.text?`<span class="typing"><span></span><span></span><span></span></span>`:esc(m.text)}</div>`;
}

function aiSendMsg(text){
  const bridge=AI();
  if(!bridge||aiBusy) return;
  aiMessages.push({role:'user',text});
  const aiMsg={role:'ai',text:'',streaming:true};
  aiMessages.push(aiMsg);
  aiBusy=true;
  renderAI();

  const finish=()=>{ aiMsg.streaming=false; aiBusy=false; renderAI(); };
  let settled=false;

  try{
    const ret=bridge.send(text,{
      allowWrite:aiAllowWrite,
      onChunk:(t)=>{ aiMsg.text+=t; if(mode==='ai'){ const l=document.getElementById('chatLog'); renderAI(); } },
      onDone:(full)=>{ if(settled) return; settled=true; if(typeof full==='string'&&full) aiMsg.text=full; finish(); },
      onError:(msg)=>{ if(settled) return; settled=true; aiMessages.pop(); aiMessages.push({role:'err',text:msg||'Something went wrong talking to Claude Code.'}); aiBusy=false; aiMsg.streaming=false; renderAI(); }
    });
    // Fallback: send() returned a Promise of the full reply instead of streaming
    if(ret && typeof ret.then==='function'){
      ret.then(full=>{ if(settled) return; settled=true; if(typeof full==='string') aiMsg.text=full; finish(); })
         .catch(e=>{ if(settled) return; settled=true; aiMessages.pop(); aiMessages.push({role:'err',text:(e&&e.message)||'Request failed.'}); aiBusy=false; renderAI(); });
    }
  }catch(e){
    settled=true; aiMessages.pop();
    aiMessages.push({role:'err',text:(e&&e.message)||'Could not start the request.'});
    aiBusy=false; renderAI();
  }
}

function setMode(m){ mode=m; buildNav(); render(); }
function select(id){
  cur=id; dir='up'; mode='params';
  buildNav(); render();
  main.scrollIntoView({behavior:'smooth',block:'start'});
}
function selectSym(id){
  curS=id;
  buildNav(); render();
  main.scrollIntoView({behavior:'smooth',block:'start'});
}

buildNav(); render();
</script>
