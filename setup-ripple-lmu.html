<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Setup Ripple LMU. Hypercar / LMP / GT3 cause &amp; effect</title>
<style>
@font-face{font-family:'Chakra Petch';font-weight:600;font-style:normal;font-display:swap;src:url('fonts/ChakraPetch-SemiBold.ttf') format('truetype')}
@font-face{font-family:'Chakra Petch';font-weight:700;font-style:normal;font-display:swap;src:url('fonts/ChakraPetch-Bold.ttf') format('truetype')}
@font-face{font-family:'Titillium Web';font-weight:400;font-style:normal;font-display:swap;src:url('fonts/TitilliumWeb-Regular.ttf') format('truetype')}
@font-face{font-family:'Titillium Web';font-weight:600;font-style:normal;font-display:swap;src:url('fonts/TitilliumWeb-SemiBold.ttf') format('truetype')}
@font-face{font-family:'Share Tech Mono';font-weight:400;font-style:normal;font-display:swap;src:url('fonts/ShareTechMono-Regular.ttf') format('truetype')}
</style>
<style>
  :root{
    --bg:#141414;
    --panel:#1a1a1a;
    --panel-2:#222222;
    --line:#303030;
    --text:#f4f6f5;
    --muted:#8a8a8a;
    --tight:#3d7fd6;   /* understeer / "tight" */
    --loose:#e8a13d;   /* oversteer / "loose" - warm, kept distinct from the red accent */
    --amber:#e8112d;   /* LM red - the brand accent (var name kept for minimal-diff from Setup Ripple) */
    --navy:#003374;
    --green:#7fd98a;
    --disp:'Chakra Petch',sans-serif;
    --body:'Titillium Web',system-ui,sans-serif;
    --mono:'Chakra Petch',sans-serif;  /* labels; --num is the numeric readout face */
  }
  *{box-sizing:border-box;margin:0;padding:0}
  html,body{height:100%}
  body{
    background:var(--bg);color:var(--text);font-family:var(--body);
    font-size:15px;line-height:1.5;
  }
  .app{display:flex;min-height:100vh;max-width:1200px;margin:0 auto}

  /* ---------- sidebar ---------- */
  nav{
    width:264px;flex:0 0 264px;border-right:1px solid var(--line);
    padding:20px 0 32px;background:var(--panel);
  }
  .brand{padding:0 18px 14px;border-bottom:1px solid var(--line);margin-bottom:10px}
  .brand h1{font-family:var(--disp);font-weight:700;font-size:26px;letter-spacing:.04em;text-transform:uppercase}
  .brand h1 span{color:var(--amber);display:block}
  .brand p{font-size:12px;color:var(--muted);margin-top:2px}
  .group{margin-top:14px}
  .group h2{
    font-family:var(--mono);font-size:10px;font-weight:600;letter-spacing:.18em;
    text-transform:uppercase;color:var(--muted);padding:0 18px 6px;
  }
  .group button{
    display:block;width:100%;text-align:left;padding:7px 18px;border:0;
    background:none;color:var(--text);font-family:var(--body);font-size:14px;
    cursor:pointer;border-left:3px solid transparent;
  }
  .group button:hover{background:var(--panel-2)}
  .group button.active{background:var(--panel-2);border-left-color:var(--amber);font-weight:600}
  .group button.linked{color:var(--amber)}
  .group button:focus-visible{outline:2px solid var(--amber);outline-offset:-2px}
  .toggle-wrap{padding:8px 12px 4px}
  .hyper-toggle{
    display:inline-flex;width:auto;align-items:center;gap:6px;padding:4px 11px;
    border:1px solid var(--line);border-radius:99px;background:none;color:var(--muted);
    font-family:var(--mono);font-size:10px;letter-spacing:.06em;text-transform:uppercase;cursor:pointer;
    text-align:center;
  }
  .hyper-toggle:hover{border-color:var(--amber);color:var(--text)}
  .hyper-toggle::before{content:'';width:7px;height:7px;border-radius:50%;background:var(--amber);flex:0 0 auto}
  .hyper-toggle.off::before{background:var(--muted)}

  /* ---------- main ---------- */
  main{flex:1;padding:26px 30px 60px;min-width:0}
  .crumb{font-family:var(--mono);font-size:11px;letter-spacing:.14em;text-transform:uppercase;color:var(--muted)}
  .title-row{display:flex;flex-wrap:wrap;align-items:baseline;gap:12px;margin:4px 0 4px}
  .title-row h2{font-family:var(--disp);font-size:38px;font-weight:700;text-transform:uppercase;letter-spacing:.02em}
  .does{color:var(--muted);max-width:62ch;margin-bottom:18px}

  .toggle{display:inline-flex;border:1px solid var(--line);border-radius:8px;overflow:hidden;margin-bottom:18px}
  .toggle button{
    border:0;background:var(--panel);color:var(--muted);padding:9px 18px;
    font-family:var(--disp);font-size:17px;font-weight:600;text-transform:uppercase;
    letter-spacing:.05em;cursor:pointer;
  }
  .toggle button.on{background:var(--panel-2);color:var(--text);box-shadow:inset 0 -3px 0 var(--amber)}
  .toggle button:focus-visible{outline:2px solid var(--amber);outline-offset:-2px}

  /* ---------- mode tabs & diagnose ---------- */
  /* mode tabs: same rocker as the direction toggle. Raised housing; the selected one is pressed in. */
  .mode-tabs{
    display:grid;grid-template-columns:1fr 1fr;gap:0;margin:12px 12px 0;overflow:hidden;
    background:linear-gradient(#2b2b2b,#1c1c1c);border:1px solid #3a3a3a;border-radius:6px;
    box-shadow:inset 0 1px 0 rgba(255,255,255,.10),0 2px 0 #000;
  }
  .mobile-nav .mode-tabs{margin:0 0 10px}
  .mode-tabs button{
    min-width:0;border:0;background:none;color:var(--lbl,#9a9a9a);padding:10px 6px;
    font-family:var(--disp);font-size:13px;font-weight:600;text-transform:uppercase;
    letter-spacing:.08em;cursor:pointer;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;
    border-right:1px solid #000;border-bottom:1px solid #000;line-height:1.4;
  }
  .mode-tabs button:nth-child(2n){border-right:0}
  .mode-tabs button:nth-child(n+3){border-bottom:0}
  .mode-tabs button:hover{color:#fff}
  .mode-tabs button.on{color:#fff;background:var(--well,#0c0c0c);box-shadow:inset 0 2px 6px rgba(0,0,0,.8),inset 0 -2px 0 var(--amber);cursor:default}
  .mode-tabs button:focus-visible{outline:2px solid var(--amber);outline-offset:-2px}
  .quick{
    background:var(--panel);border:1px solid var(--line);border-left:3px solid var(--amber);
    border-radius:8px;padding:12px 14px;margin-bottom:20px;font-size:14px;
  }
  .quick b{
    display:block;color:var(--amber);font-family:var(--mono);font-size:11px;
    font-weight:600;letter-spacing:.14em;text-transform:uppercase;margin-bottom:4px;
  }
  .cause{
    display:flex;gap:12px;align-items:flex-start;background:var(--panel);
    border:1px solid var(--line);border-radius:8px;padding:12px;margin-bottom:8px;
  }
  .cause .rank{font-family:var(--mono);font-size:12px;color:var(--muted);padding-top:3px}
  .cause .body{flex:1;min-width:0}
  .cause .body strong{display:block}
  .cause .body p{font-size:14px;color:var(--muted)}
  .cause > button{
    flex:0 0 auto;border:1px solid var(--line);background:var(--panel-2);color:var(--amber);
    font-family:var(--mono);font-size:12px;padding:4px 9px;border-radius:6px;cursor:pointer;white-space:nowrap;
  }
  .cause > button:hover{border-color:var(--amber)}

  /* ---------- engineer ---------- */
  .eng-actions{display:flex;flex-wrap:wrap;gap:10px;margin-bottom:12px}
  .btn{
    border:1px solid var(--line);background:var(--panel-2);color:var(--text);
    font-family:var(--disp);font-size:15px;font-weight:600;letter-spacing:.05em;
    text-transform:uppercase;padding:9px 16px;border-radius:8px;cursor:pointer;
  }
  .btn:hover{border-color:var(--amber)}
  .btn.primary{background:var(--amber);color:#fff;border-color:var(--amber)}
  .btn:disabled{opacity:.4;cursor:not-allowed}
  .btn:focus-visible{outline:2px solid var(--amber);outline-offset:2px}
  .eng-status{font-family:var(--mono);font-size:12px;color:var(--muted);margin-bottom:18px}
  .eng-status b{color:var(--green)}
  .selrow{display:flex;flex-wrap:wrap;gap:10px;align-items:center;margin-bottom:12px}
  .selrow label{font-family:var(--mono);font-size:11px;letter-spacing:.12em;text-transform:uppercase;color:var(--muted)}
  .selrow select{
    flex:1;min-width:200px;background:var(--panel);color:var(--text);
    border:1px solid var(--line);border-radius:8px;padding:9px 10px;font-family:var(--body);font-size:14px;
  }
  table.diff{width:100%;border-collapse:collapse;margin:14px 0 6px;font-size:14px}
  table.diff th{
    text-align:left;font-family:var(--mono);font-size:10px;letter-spacing:.14em;
    text-transform:uppercase;color:var(--muted);padding:6px 8px;border-bottom:1px solid var(--line);
  }
  table.diff td{padding:7px 8px;border-bottom:1px solid var(--line);vertical-align:top}
  table.diff td.num{font-family:var(--mono);font-size:13px;white-space:nowrap}
  .chip{
    display:inline-block;font-family:var(--mono);font-size:10.5px;letter-spacing:.08em;
    text-transform:uppercase;padding:2px 7px;border-radius:99px;border:1px solid var(--line);
  }
  .chip.tight{color:var(--tight);border-color:var(--tight)}
  .chip.loose{color:var(--loose);border-color:var(--loose)}
  .chip.min{color:var(--amber);border-color:var(--amber)}
  .fix-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(230px,1fr));gap:10px;margin-bottom:18px}
  .req-group-h{display:flex;align-items:baseline;gap:10px;margin:16px 0 8px}
  .req-group-h span{font-family:var(--disp);font-weight:600;font-size:12.5px;letter-spacing:.14em;text-transform:uppercase;color:var(--lbl-hi)}
  .req-group-h em{font-style:normal;font-family:var(--body);font-size:13px;color:var(--lbl)}
  .req-group-h::after{content:'';flex:1;height:1px;background:var(--line);align-self:center}
  .req-group .fix-grid{margin-bottom:6px}
  .fix-card.on{border-color:var(--amber);background:var(--well);box-shadow:inset 0 2px 6px rgba(0,0,0,.8),inset 0 -2px 0 var(--amber)}
  .pend-x{background:none;border:1px solid var(--line);color:var(--lbl);border-radius:4px;width:22px;height:22px;line-height:1;cursor:pointer;font-size:14px;padding:0}
  .pend-x:hover{border-color:var(--amber);color:#fff}
  .cmp-why{color:var(--lbl);font-size:13px}
  .eng-staged{font-family:var(--body);font-size:13.5px;color:var(--lbl);margin:-6px 0 12px}
  .eng-staged b{color:var(--loose)}
  .linkbtn{background:none;border:0;padding:0;color:var(--navy-txt);font:inherit;cursor:pointer;text-decoration:underline}
  .fix-card{
    text-align:left;background:var(--panel);border:1px solid var(--line);border-radius:10px;
    padding:14px;cursor:pointer;color:var(--text);font-family:var(--body);
  }
  .fix-card:hover{border-color:var(--green)}
  .fix-card.on{border-color:var(--green);box-shadow:inset 0 0 0 1px var(--green)}
  .fix-card h4{font-family:var(--disp);font-size:18px;font-weight:600;text-transform:uppercase;letter-spacing:.04em}
  .fix-card p{font-size:13px;color:var(--muted);margin-top:4px}
  .warn{color:var(--amber);font-size:13px;margin:8px 0}
  .eng-empty{color:var(--muted);font-size:14px;padding:14px;border:1px dashed var(--line);border-radius:8px}
  .eng-note{color:var(--muted);font-size:12px;margin-top:8px;line-height:1.5}
  .eng-nudge{display:inline-flex;align-items:center;gap:3px;flex:0 0 auto;white-space:nowrap}
  .nbtn{
    background:var(--panel-2);border:1px solid var(--line);color:var(--text);
    width:22px;height:22px;border-radius:5px;cursor:pointer;font-size:11px;line-height:1;
    display:inline-flex;align-items:center;justify-content:center;padding:0;flex:0 0 auto;
  }
  .nbtn:hover{border-color:var(--amber);color:var(--amber)}
  .nbtn:active{background:var(--amber);color:#fff}
  /* badge sits in a fixed-width slot so showing/hiding it never shifts the buttons */
  .eng-pend{font-family:var(--mono);font-size:11px;color:var(--amber);text-align:right;flex:0 0 22px;min-width:22px}
  .fix-sub{font-family:var(--mono);font-size:11px;letter-spacing:.12em;text-transform:uppercase;color:var(--muted);margin:18px 0 10px}
  td input[type=checkbox]{accent-color:var(--green)}

  /* ---------- six-page engineer (LMU) ---------- */
  .eng-meta{font-family:var(--mono);font-size:12px;letter-spacing:.04em;color:var(--amber);margin:2px 0 14px}
  .eng-arch{display:flex;align-items:flex-start;gap:10px;flex-wrap:wrap;margin:-8px 0 14px}
  .eng-arch-tag{
    flex:0 0 auto;font-family:var(--mono);font-size:10px;letter-spacing:.12em;text-transform:uppercase;
    padding:3px 8px;border:1px solid var(--navy);background:#0d1b2e;color:#6b9bd4;border-radius:3px;
  }
  .eng-arch-note{flex:1;min-width:240px;font-size:12.5px;color:var(--muted);line-height:1.5;max-width:70ch}
  .eng-ptabs{display:flex;flex-wrap:wrap;gap:4px;margin-bottom:16px;border-bottom:1px solid var(--line);padding-bottom:0}
  .eng-ptab{
    background:none;border:none;border-bottom:2px solid transparent;color:var(--muted);
    font-family:var(--mono);font-size:12px;letter-spacing:.06em;text-transform:uppercase;
    padding:8px 12px;cursor:pointer;margin-bottom:-1px;
  }
  .eng-ptab:hover{color:var(--text)}
  .eng-ptab.on{color:var(--text);border-bottom-color:var(--amber)}
  .eng-ptab:focus-visible{outline:2px solid var(--amber);outline-offset:-2px}
  .eng-page{display:grid;grid-template-columns:repeat(auto-fill,minmax(280px,1fr));gap:16px;margin-bottom:18px}
  .eng-group{background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:14px 16px;overflow:hidden}
  .eng-group h4{
    font-family:var(--mono);font-size:11px;letter-spacing:.12em;text-transform:uppercase;
    color:var(--muted);margin-bottom:10px;display:flex;align-items:center;gap:8px;
  }
  /* row: label flexes, everything else sits in a no-shrink control cluster that wraps as a unit */
  .eng-row{display:flex;flex-wrap:wrap;align-items:center;gap:6px 8px;padding:6px 0;border-bottom:1px solid rgba(255,255,255,.04)}
  .eng-row:last-child{border-bottom:none}
  .eng-row.na{opacity:.4}
  .eng-k{font-size:13.5px;color:var(--text);flex:1 1 auto;min-width:80px}
  .eng-row.na .eng-k{color:var(--muted)}
  .eng-v{font-family:var(--mono);font-size:13px;color:var(--text);text-align:right;white-space:nowrap;flex:0 0 auto}
  .eng-v3{font-family:var(--mono);font-size:11px;color:var(--muted);white-space:nowrap;flex:0 0 auto}
  /* a value glued to its nudge buttons. Wraps as one unit, never splits or clips */
  .eng-cell{display:inline-flex;align-items:center;gap:6px;flex:0 0 auto}
  .eng-3rd{padding-left:8px;border-left:1px solid var(--line)}
  .cmp-table{width:100%;border-collapse:collapse;margin:14px 0 6px;font-size:13.5px}
  .cmp-table th{
    text-align:left;font-family:var(--mono);font-size:10px;letter-spacing:.14em;
    text-transform:uppercase;color:var(--muted);padding:6px 8px;border-bottom:1px solid var(--line);
  }
  .cmp-table td{padding:7px 8px;border-bottom:1px solid var(--line)}
  .cmp-a{font-family:var(--mono);color:var(--muted);white-space:nowrap}
  .cmp-b{font-family:var(--mono);color:var(--text);white-space:nowrap}
  .cmp-arrow{color:var(--amber);text-align:center}

  /* ---------- fuel calculator (engineer sidebar) ---------- */
  .fuel{background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:14px;margin-top:8px}
  .fuel h3{font-family:var(--disp);font-size:18px;font-weight:600;text-transform:uppercase;letter-spacing:.05em;color:var(--amber);margin-bottom:4px}
  .fuel .sub{font-size:12.5px;color:var(--muted);margin-bottom:12px}
  .fuel-row{display:flex;align-items:center;justify-content:space-between;gap:10px;margin-bottom:8px}
  .fuel-row label{font-size:13.5px;color:var(--text)}
  .fuel-row input{width:84px;background:var(--bg);color:var(--text);border:1px solid var(--line);border-radius:6px;padding:6px 8px;font-family:var(--mono);font-size:13px;text-align:right}
  .fuel-row input:focus{outline:none;border-color:var(--amber)}
  .fuel-out{margin-top:12px;border-top:1px solid var(--line);padding-top:12px}
  .fuel-out .big{font-family:var(--disp);font-size:34px;font-weight:700;color:var(--green);line-height:1}
  .fuel-out .big span{font-size:16px;color:var(--muted);font-weight:600}
  .fuel-out .line{display:flex;justify-content:space-between;font-size:13px;color:var(--muted);margin-top:6px}
  .fuel-out .line b{color:var(--text);font-family:var(--mono)}
  .fuel-warn{color:var(--amber);font-size:12.5px;margin-top:8px}

  /* ---------- Bono AI chat ---------- */
  .chat-wrap{display:flex;flex-direction:column;height:calc(100vh - 150px);min-height:420px}
  .chat-log{flex:1;overflow-y:auto;padding:4px 2px 12px;display:flex;flex-direction:column;gap:12px}
  .msg{max-width:88%;padding:11px 14px;border-radius:12px;font-size:14.5px;line-height:1.55;white-space:pre-wrap;word-wrap:break-word}
  .msg.user{align-self:flex-end;background:var(--panel-2);border:1px solid var(--line)}
  .msg.ai{align-self:flex-start;background:var(--panel);border:1px solid var(--line);border-left:3px solid var(--amber)}
  .msg.ai .who{font-family:var(--mono);font-size:10px;letter-spacing:.16em;text-transform:uppercase;color:var(--amber);margin-bottom:5px}
  .msg.err{align-self:flex-start;background:rgba(255,92,92,.08);border:1px solid var(--loose);color:var(--loose)}
  .chat-input{display:flex;gap:8px;border-top:1px solid var(--line);padding-top:12px}
  .chat-input textarea{flex:1;resize:none;background:var(--bg);color:var(--text);border:1px solid var(--line);border-radius:8px;padding:10px 12px;font-family:var(--body);font-size:14.5px;line-height:1.4;max-height:140px}
  .chat-input textarea:focus{outline:none;border-color:var(--amber)}
  .chat-tools{display:flex;align-items:center;gap:14px;margin-bottom:10px;font-size:13px;color:var(--muted)}
  .chat-tools label{display:flex;align-items:center;gap:6px;cursor:pointer}
  .chat-tools input[type=checkbox]{accent-color:var(--amber)}
  .setup-picker{display:flex;flex-wrap:wrap;gap:8px;align-items:center;margin-bottom:10px}
  .setup-picker .sp-label{font-family:var(--mono);font-size:10px;letter-spacing:.12em;text-transform:uppercase;color:var(--muted)}
  .setup-picker select{flex:1;min-width:120px;background:var(--bg);color:var(--text);border:1px solid var(--line);border-radius:8px;padding:8px 9px;font-family:var(--body);font-size:13.5px}
  .setup-picker select:disabled{opacity:.4}
  .setup-picker button{flex:0 0 auto;border:1px solid var(--line);background:var(--panel-2);color:var(--amber);font-family:var(--mono);font-size:12px;padding:7px 11px;border-radius:8px;cursor:pointer}
  .setup-picker button:hover:not(:disabled){border-color:var(--amber)}
  .setup-picker button:disabled{opacity:.4;cursor:not-allowed}
  .setup-picker .sp-hint{flex-basis:100%;font-size:12px;color:var(--muted)}
  .setup-picker .sp-hint a{color:var(--amber);cursor:pointer;text-decoration:underline}
  .setup-picker .sp-hint b{color:var(--text)}
  #spReload{flex:0 0 auto;border:1px solid var(--line);background:var(--panel-2);color:var(--muted);padding:7px 10px;border-radius:8px;cursor:pointer;font-size:13px}
  #spReload:hover{border-color:var(--amber);color:var(--amber)}
  .chat-empty{align-self:center;text-align:center;color:var(--muted);font-size:14px;margin:auto;max-width:46ch}
  .chat-empty .ex{display:block;margin-top:14px;font-size:13px}
  .chat-empty .ex button{display:block;width:100%;margin:6px 0;text-align:left;background:var(--panel);border:1px solid var(--line);color:var(--text);border-radius:8px;padding:9px 12px;cursor:pointer;font-family:var(--body);font-size:13.5px}
  .chat-empty .ex button:hover{border-color:var(--amber)}
  .fallback{max-width:54ch;margin:40px auto;text-align:center}
  .fallback .icon{font-size:40px;margin-bottom:14px}
  .fallback h3{font-family:var(--disp);font-size:24px;font-weight:700;text-transform:uppercase;letter-spacing:.03em;margin-bottom:10px}
  .fallback p{color:var(--muted);font-size:14.5px;margin-bottom:10px}
  .fallback ol{text-align:left;color:var(--text);font-size:14px;margin:14px auto;padding-left:22px;max-width:40ch;line-height:1.7}
  .fallback code{background:var(--panel);border:1px solid var(--line);border-radius:4px;padding:1px 6px;font-family:var(--mono);font-size:12.5px}
  .fallback a{color:var(--amber)}
  .fallback-wide{max-width:60ch}
  .tut{text-align:left;margin:18px auto;max-width:52ch;display:flex;flex-direction:column;gap:14px}
  .tut-step{display:flex;gap:12px;align-items:flex-start;font-size:14px;line-height:1.6;color:var(--text)}
  .tut-n{flex:0 0 auto;width:24px;height:24px;border-radius:50%;background:var(--amber);color:#fff;font-family:var(--mono);font-weight:700;font-size:13px;display:flex;align-items:center;justify-content:center;margin-top:1px}
  .tut-cmd{margin-top:7px}
  .tut-cmd code{display:block;background:var(--bg);border:1px solid var(--line);border-radius:6px;padding:8px 10px;font-family:var(--mono);font-size:12.5px;color:var(--amber);word-break:break-all}
  .tut-status{font-family:var(--mono);font-size:12px;color:var(--muted);background:var(--panel);border:1px solid var(--line);border-radius:6px;padding:6px 10px;display:inline-block}
  .tut-foot{font-size:13px;color:var(--muted);margin-top:6px;line-height:1.6}
  .typing{display:inline-flex;gap:4px;align-items:center}
  .typing span{width:6px;height:6px;border-radius:50%;background:var(--amber);animation:tp 1s infinite}
  .typing span:nth-child(2){animation-delay:.15s} .typing span:nth-child(3){animation-delay:.3s}
  @keyframes tp{0%,60%,100%{opacity:.3}30%{opacity:1}}
  @media (prefers-reduced-motion:reduce){.typing span{animation:none;opacity:.7}}

  /* ---------- balance bar (signature) ---------- */
  .bal{background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:16px 18px 20px;margin-bottom:22px}
  .bal-labels{display:flex;justify-content:space-between;font-family:var(--mono);font-size:11px;letter-spacing:.12em;text-transform:uppercase}
  .bal-labels .t{color:var(--tight)} .bal-labels .n{color:var(--muted)} .bal-labels .l{color:var(--loose)}
  .bal-track{position:relative;height:10px;border-radius:5px;margin-top:10px;
    background:linear-gradient(90deg,var(--tight) 0%,#3b4a5c 38%,#3b4a5c 62%,var(--loose) 100%)}
  .bal-mark{
    position:absolute;top:-7px;width:4px;height:24px;border-radius:2px;background:#fff;
    left:50%;transform:translateX(-50%);transition:left .45s cubic-bezier(.2,.8,.2,1);
    box-shadow:0 0 8px rgba(255,255,255,.55);
  }
  .bal-tick{position:absolute;top:0;bottom:0;width:1px;background:rgba(255,255,255,.25);left:50%}
  .bal-note{font-size:13px;color:var(--muted);margin-top:12px}
  .bal-note strong{color:var(--text)}
  @media (prefers-reduced-motion:reduce){.bal-mark{transition:none}}

  /* ---------- sections ---------- */
  section{margin-bottom:24px}
  section h3{
    font-family:var(--disp);font-size:19px;font-weight:600;text-transform:uppercase;
    letter-spacing:.06em;color:var(--amber);margin-bottom:8px;
  }
  section h3.kn{color:var(--tight)}
  section h3.cp{color:var(--green)}
  ul.fx{list-style:none}
  ul.fx li{padding:7px 0 7px 16px;border-bottom:1px solid var(--line);position:relative}
  ul.fx li::before{content:"";position:absolute;left:0;top:15px;width:6px;height:6px;border-radius:50%;background:var(--amber)}
  .knock{display:flex;flex-direction:column;gap:8px}
  .knock-item{
    display:flex;gap:12px;align-items:flex-start;background:var(--panel);
    border:1px solid var(--line);border-radius:8px;padding:10px 12px;
  }
  .knock-item button{
    flex:0 0 auto;border:1px solid var(--line);background:var(--panel-2);color:var(--amber);
    font-family:var(--mono);font-size:12px;padding:4px 9px;border-radius:6px;cursor:pointer;white-space:nowrap;
  }
  .knock-item button:hover{border-color:var(--amber)}
  .knock-item p{font-size:14px;color:var(--text)}
  .comp li::before{background:var(--green)}
  .footnote{font-size:12.5px;color:var(--muted);border-top:1px solid var(--line);padding-top:14px;max-width:70ch}

  /* ---------- mobile ---------- */
  .mobile-nav{display:none}
  @media (max-width:760px){
    .app{flex-direction:column}
    nav{display:none}
    .mobile-nav{display:block;position:sticky;top:0;z-index:5;background:var(--bg);padding:12px 14px;border-bottom:1px solid var(--line)}
    .mobile-nav .brand{padding:0 0 10px;border:0;margin:0}
    .mobile-nav select{
      width:100%;background:var(--panel);color:var(--text);border:1px solid var(--line);
      border-radius:8px;padding:10px 12px;font-family:var(--body);font-size:15px;
    }
    main{padding:18px 16px 50px}
    .title-row h2{font-size:30px}
  }

  /* ═══════════ Design system v2 : tactile ═══════════
     Pressable = raised (light top lip, hard shelf, drops on press).
     Readout   = recessed well, faint glow only where it carries meaning.
     Type: --disp Chakra Petch for anything uppercase, --body Titillium for prose,
           --num Share Tech Mono for numeric readouts only, 14px and up. */
  :root{
    --num:'Share Tech Mono',ui-monospace,monospace;
    --navy2:#0458A3; --navy-tint:#0d1b2e; --navy-txt:#5b9cf0;
    --prose:#c9cbd0; --lbl:#9a9a9a; --lbl-hi:#d6d8dc;
    --well:#0c0c0c; --well-line:#2a2a2a;
  }
  .ds-well{background:var(--well);border:1px solid var(--well-line);border-radius:6px;box-shadow:inset 0 2px 6px rgba(0,0,0,.7)}
  .ds-plate{background:linear-gradient(#1c1c1c,#161616);border:1px solid var(--line);border-radius:6px;box-shadow:inset 0 1px 0 rgba(255,255,255,.06),0 2px 0 #0a0a0a}

  .ds-lbl{font-family:var(--disp);font-weight:600;font-size:12.5px;letter-spacing:.1em;text-transform:uppercase;color:var(--lbl)}
  .ds-lbl.hi{color:var(--lbl-hi)}
  .ds-prose{font-family:var(--body);font-size:15px;line-height:1.55;color:var(--prose);max-width:64ch}

  /* raised button */
  .ds-btn{
    display:inline-flex;align-items:center;justify-content:center;gap:6px;
    background:linear-gradient(#2b2b2b,#1c1c1c);border:1px solid #3a3a3a;border-radius:5px;
    box-shadow:inset 0 1px 0 rgba(255,255,255,.10),0 2px 0 #000;color:var(--lbl-hi);
    font-family:var(--disp);font-weight:600;font-size:12.5px;letter-spacing:.08em;text-transform:uppercase;
    padding:6px 13px;line-height:1.4;cursor:pointer;white-space:nowrap;
    transition:transform .06s,box-shadow .06s,border-color .1s;
  }
  .ds-btn:hover{border-color:var(--navy2);color:#fff}
  .ds-btn:active{transform:translateY(2px);box-shadow:inset 0 1px 0 rgba(255,255,255,.04),0 0 0 #000}
  .ds-btn.pri{background:linear-gradient(#ff2a45,#c80e26);border-color:var(--amber);color:#fff}
  .ds-btn.pri:hover{border-color:#ff6b7d}
  .ds-btn:disabled{opacity:.45;cursor:default;transform:none}

  /* jump chip: red hairline, white text, small */
  .ds-chip{
    display:inline-block;background:transparent;border:1px solid var(--amber);border-radius:3px;color:#fff;
    font-family:var(--disp);font-weight:600;font-size:11.5px;letter-spacing:.06em;text-transform:uppercase;
    padding:1px 7px;line-height:1.5;cursor:pointer;white-space:nowrap;box-shadow:0 1px 0 #000;
    transition:background .1s,transform .06s,box-shadow .06s;
  }
  .ds-chip:hover{background:var(--amber)}
  .ds-chip:active{transform:translateY(1px);box-shadow:none}
  .ds-chip.green{border-color:var(--green)}
  .ds-chip.green:hover{background:#1f5c37}

  /* session strip */
  .ds-strip{display:flex;align-items:stretch;flex-wrap:wrap;margin-bottom:12px;font-family:var(--disp);font-weight:600;font-size:12.5px;letter-spacing:.1em;text-transform:uppercase;color:var(--lbl)}
  .ds-strip>span{padding:8px 12px;border-right:1px solid var(--well-line)}
  .ds-strip>span.sr{background:var(--amber);color:#fff;font-weight:700;font-size:13px;border-radius:5px 0 0 5px;border-right:0}
  .ds-strip>span.car{color:var(--lbl-hi)}
  .ds-strip>span.end{margin-left:auto;border-right:0}
  .ds-strip>span.tight{color:var(--navy-txt);text-shadow:0 0 8px rgba(61,127,214,.55)}
  .ds-strip>span.loose{color:var(--loose);text-shadow:0 0 8px rgba(232,161,61,.45)}
  .ds-strip>span.arch{color:var(--navy-txt)}

  /* header plate with notch */
  .ds-head{position:relative;padding:18px 20px 16px;margin-bottom:16px}
  .ds-head::before{content:'';position:absolute;top:-1px;left:-1px;width:0;height:0;border-top:24px solid var(--amber);border-right:24px solid transparent;border-radius:6px 0 0 0}
  .ds-head .grp{font-family:var(--disp);font-weight:600;font-size:12.5px;letter-spacing:.2em;text-transform:uppercase;color:var(--lbl);margin-bottom:6px;padding-left:16px}
  .ds-head .ttl{font-family:var(--disp);font-weight:700;font-size:34px;text-transform:uppercase;color:var(--text);line-height:1;margin:0}
  .ds-head .sub{font-family:var(--disp);font-weight:600;font-size:18px;text-transform:uppercase;color:var(--amber);letter-spacing:.06em;margin-top:4px}

  /* section heading: label + rule */
  .ds-sec{display:flex;align-items:center;gap:12px;margin:22px 0 4px}
  .ds-sec .rule{flex:1;height:2px;background:var(--amber)}
  .ds-sec .rule.soft{height:1px;background:var(--line)}
  .ds-sec .rule.green{background:var(--green)}

  /* callout well with a coloured edge */
  .ds-call{display:flex;overflow:hidden;margin-bottom:20px}
  .ds-call .edge{width:4px;flex:0 0 4px}
  .ds-call .edge.loose{background:var(--loose);box-shadow:0 0 10px rgba(232,161,61,.45)}
  .ds-call .edge.navy{background:var(--navy2);box-shadow:0 0 10px rgba(4,88,163,.5)}
  .ds-call .body{padding:11px 14px;font-family:var(--body);font-size:14.5px;line-height:1.55;color:var(--prose)}
  .ds-call .body b{display:block;font-family:var(--disp);font-weight:600;font-size:12.5px;letter-spacing:.2em;text-transform:uppercase;margin-bottom:4px}
  .ds-call .body b.loose{color:var(--loose)}
  .ds-call .body b.navy{color:var(--navy-txt)}

  /* ranked cause row */
  .ds-cause{display:flex;align-items:flex-start;gap:14px;padding:14px 0 13px;border-bottom:1px solid #262626}
  .ds-cause:last-of-type{border-bottom:none}
  .ds-rank{flex:0 0 44px;height:44px;display:flex;align-items:center;justify-content:center;font-family:var(--disp);font-weight:700;font-size:22px;font-variant-numeric:tabular-nums;color:#7c7e83}
  .ds-rank.r1{color:#ff3b52;text-shadow:0 0 12px rgba(232,17,45,.55)}
  .ds-rank.r2{color:#a8aab0}
  .ds-cause .name{font-family:var(--disp);font-weight:700;font-size:18px;text-transform:uppercase;color:var(--text)}
  .ds-cause .row1{display:flex;align-items:center;gap:10px;flex-wrap:wrap}
  .ds-cause .fix{font-family:var(--body);font-size:14.5px;color:var(--prose);line-height:1.55;margin:5px 0 0;max-width:66ch}

  /* ruled effects list */
  .ds-fx{list-style:none;margin:0;padding:0}
  .ds-fx li{display:flex;gap:12px;padding:10px 0;border-bottom:1px solid #262626;font-family:var(--body);font-size:15px;line-height:1.55;color:var(--prose)}
  .ds-fx li:last-child{border-bottom:none}
  .ds-fx li::before{content:'\25C6';flex:0 0 auto;color:var(--lbl);font-size:10px;padding-top:6px}

  /* chip + text rows (knock-ons, compensations) */
  .ds-krow{display:flex;align-items:flex-start;gap:12px;padding:11px 0;border-bottom:1px solid #262626}
  .ds-krow:last-child{border-bottom:none}
  .ds-krow p{margin:0;font-family:var(--body);font-size:14.5px;line-height:1.55;color:var(--prose);flex:1;min-width:0;padding-top:1px}

  /* rocker: one housing, positions pressed in when active */
  .ds-rocker{display:inline-flex;background:linear-gradient(#2b2b2b,#1c1c1c);border:1px solid #3a3a3a;border-radius:6px;box-shadow:inset 0 1px 0 rgba(255,255,255,.10),0 2px 0 #000;overflow:hidden;flex-wrap:wrap}
  .ds-rocker>button{background:none;border:0;border-right:1px solid #000;padding:7px 16px;font-family:var(--disp);font-weight:600;font-size:12.5px;letter-spacing:.1em;text-transform:uppercase;color:var(--lbl);cursor:pointer;line-height:1.4}
  .ds-rocker>button:last-child{border-right:0}
  .ds-rocker>button:hover{color:#fff}
  .ds-rocker>button.on{color:#fff;background:var(--well);box-shadow:inset 0 2px 6px rgba(0,0,0,.8),inset 0 -2px 0 var(--amber);cursor:default}

  /* balance gauge */
  .ds-gauge{padding:12px 16px}
  .ds-gauge .lab{display:flex;justify-content:space-between;gap:8px;flex-wrap:wrap;font-family:var(--disp);font-weight:600;font-size:12.5px;letter-spacing:.1em;text-transform:uppercase;margin-bottom:10px}
  .ds-gauge .lab .t{color:var(--navy-txt)} .ds-gauge .lab .n{color:var(--lbl)} .ds-gauge .lab .l{color:var(--loose)}
  .ds-gauge .track{position:relative;height:10px;border-radius:5px;background:linear-gradient(90deg,var(--tight) 0%,#2a2a2a 50%,var(--loose) 100%);box-shadow:inset 0 2px 4px rgba(0,0,0,.8)}
  .ds-gauge .tick{position:absolute;left:50%;top:-4px;width:1px;height:18px;background:#4a4a4a}
  .ds-gauge .mark{position:absolute;top:-5px;width:20px;height:20px;margin-left:-10px;border-radius:50%;background:linear-gradient(#f4f6f5,#c9cbd0);box-shadow:0 0 0 2px var(--bg),0 2px 0 #000;transition:left .45s cubic-bezier(.2,.8,.2,1)}
  .ds-gauge .mark.t{box-shadow:0 0 0 2px var(--bg),0 0 12px rgba(61,127,214,.85),0 2px 0 #000}
  .ds-gauge .mark.l{box-shadow:0 0 0 2px var(--bg),0 0 12px rgba(232,161,61,.85),0 2px 0 #000}
  .ds-gauge .note{margin:12px 0 0;font-family:var(--body);font-size:14.5px;line-height:1.5;color:var(--prose)}

  /* footer legend strip */
  .ds-foot{display:flex;flex-wrap:wrap;margin-top:18px;font-family:var(--disp);font-weight:600;font-size:12.5px;letter-spacing:.1em;text-transform:uppercase;color:var(--lbl)}
  .ds-foot .hint{padding:9px 14px;flex:1;min-width:200px}
  .ds-foot .key{padding:9px 12px;border-left:1px solid var(--well-line)}
  .ds-foot .key.loose{color:var(--loose)} .ds-foot .key.navy{color:var(--navy-txt)}

  .ds-btn:focus-visible,.ds-chip:focus-visible,.ds-rocker>button:focus-visible{outline:2px solid var(--amber);outline-offset:2px}
  @media (prefers-reduced-motion:reduce){
    .ds-btn,.ds-chip,.ds-gauge .mark{transition:none}
  }
  @media (max-width:760px){
    .ds-head .ttl{font-size:28px}
    .ds-strip>span{padding:7px 9px}
  }

  /* ═══════════ Design system v2 : Engineer ═══════════ */
  /* section headings (1 · Load, 2 · View …) */
  #main section > h3{
    font-family:var(--disp);font-weight:600;font-size:12.5px;letter-spacing:.2em;text-transform:uppercase;
    color:var(--lbl-hi);display:flex;align-items:center;gap:12px;margin:22px 0 10px;
  }
  #main section > h3::after{content:'';flex:1;height:2px;background:var(--amber)}

  /* generic buttons in Engineer become raised */
  #main .btn{
    background:linear-gradient(#2b2b2b,#1c1c1c);border:1px solid #3a3a3a;border-radius:5px;
    box-shadow:inset 0 1px 0 rgba(255,255,255,.10),0 2px 0 #000;color:var(--lbl-hi);
    font-family:var(--disp);font-weight:600;font-size:12.5px;letter-spacing:.08em;text-transform:uppercase;
    padding:6px 13px;line-height:1.4;transition:transform .06s,box-shadow .06s,border-color .1s;
  }
  #main .btn:hover{border-color:var(--navy2);color:#fff}
  #main .btn:active{transform:translateY(2px);box-shadow:inset 0 1px 0 rgba(255,255,255,.04),0 0 0 #000}
  #main .btn.primary{background:linear-gradient(#ff2a45,#c80e26);border-color:var(--amber);color:#fff}
  #main .btn.primary:hover{border-color:#ff6b7d}
  #main .btn:disabled{opacity:.45;transform:none}

  /* setup selectors sit in wells */
  #main .selrow select{
    background:var(--well);border:1px solid var(--well-line);border-radius:6px;color:var(--text);
    box-shadow:inset 0 2px 6px rgba(0,0,0,.7);font-family:var(--num);font-size:14px;padding:7px 10px;
  }
  #main .selrow label{font-family:var(--disp);font-weight:600;font-size:12.5px;letter-spacing:.1em;text-transform:uppercase;color:var(--lbl)}

  /* page tabs: rocker */
  .eng-ptabs,.vpages{
    display:inline-flex!important;flex-wrap:wrap;gap:0!important;margin-bottom:16px;padding:0!important;
    background:linear-gradient(#2b2b2b,#1c1c1c);border:1px solid #3a3a3a!important;border-radius:6px;
    box-shadow:inset 0 1px 0 rgba(255,255,255,.10),0 2px 0 #000;overflow:hidden;
  }
  .eng-ptab,.vpage{
    background:none!important;border:0!important;border-right:1px solid #000!important;border-radius:0!important;
    padding:7px 14px!important;font-family:var(--disp)!important;font-weight:600;font-size:12.5px!important;
    letter-spacing:.08em;text-transform:uppercase;color:var(--lbl)!important;box-shadow:none!important;line-height:1.4;
  }
  .eng-ptab:last-child,.vpage:last-child{border-right:0!important}
  .eng-ptab:hover,.vpage:hover{color:#fff!important}
  .eng-ptab.on,.vpage.on{color:#fff!important;background:var(--well)!important;box-shadow:inset 0 2px 6px rgba(0,0,0,.8),inset 0 -2px 0 var(--amber)!important}

  /* group headings inside a page */
  .eng-group h4,.vgroup h4{
    font-family:var(--disp);font-weight:600;font-size:12.5px;letter-spacing:.14em;text-transform:uppercase;
    color:var(--lbl-hi);display:flex;align-items:center;gap:10px;margin:18px 0 6px;
  }
  .eng-group h4::after,.vgroup h4::after{content:'';flex:1;height:1px;background:var(--line)}
  .eng-lr{font-size:11px;letter-spacing:.1em;color:var(--lbl);font-weight:600;border:0;padding:0}

  /* rows */
  .eng-row,.vrow{border-bottom:1px solid #262626;padding:9px 0;align-items:center}
  .eng-k,.vlabel{font-family:var(--disp);font-weight:600;font-size:13px;letter-spacing:.06em;text-transform:uppercase;color:var(--prose)}
  .eng-row.na .eng-k{color:var(--lbl)}

  /* value cell = recessed well; value in the numeric face */
  .eng-cell,.vcell{
    display:inline-flex;align-items:center;gap:6px;background:none;border:0;padding:0;
  }
  .vcl{font-family:var(--disp);font-weight:600;font-size:11.5px;letter-spacing:.1em;text-transform:uppercase;color:var(--lbl);min-width:20px}
  .eng-v,.vcv{
    background:var(--well);border:1px solid var(--well-line);border-radius:6px;
    box-shadow:inset 0 2px 6px rgba(0,0,0,.7);font-family:var(--num);font-size:16px;font-weight:400;
    color:var(--text);padding:4px 10px;min-width:64px;text-align:center;
  }
  .eng-row.na .eng-v{color:var(--lbl);font-size:13px;font-family:var(--disp)}
  .eng-v.changed,.vcv.changed{color:#ffd27a;text-shadow:0 0 10px rgba(232,161,61,.55)}

  /* nudge: small raised squares, badge slot always reserved */
  .eng-nudge{display:inline-flex;align-items:center;gap:4px;margin-left:4px}
  .eng-pend{font-family:var(--disp);font-weight:700;font-size:11.5px;color:var(--loose);width:22px;min-width:22px;text-align:right;display:inline-block}
  .nbtn{
    width:22px;height:22px;border-radius:4px;padding:0;line-height:1;font-size:11px;
    background:linear-gradient(#2b2b2b,#1c1c1c);border:1px solid #3a3a3a;color:var(--lbl-hi);
    box-shadow:inset 0 1px 0 rgba(255,255,255,.10),0 2px 0 #000;transition:transform .06s,box-shadow .06s;
  }
  .nbtn:hover{border-color:var(--navy2);color:#fff}
  .nbtn:active{transform:translateY(2px);box-shadow:inset 0 1px 0 rgba(255,255,255,.04),0 0 0 #000;background:#1c1c1c;color:#fff}

  /* status, empty, actions, save bar */
  .eng-status{font-family:var(--body);font-size:13.5px;color:var(--lbl);line-height:1.5}
  .eng-empty{font-family:var(--body);font-size:14.5px;color:var(--lbl)}
  .eng-actions{display:flex;align-items:center;gap:10px;flex-wrap:wrap;background:var(--well);border:1px solid var(--well-line);border-radius:6px;box-shadow:inset 0 2px 6px rgba(0,0,0,.7);padding:8px 8px 8px 14px;margin-top:14px}
  .eng-actions .eng-status{flex:1;min-width:200px}
  .eng-meta{font-family:var(--disp);font-weight:600;font-size:12.5px;letter-spacing:.1em;text-transform:uppercase;color:var(--lbl-hi)}

  /* driver-request fix cards: raised plates */
  .fix-card{
    background:linear-gradient(#1c1c1c,#161616);border:1px solid var(--line);border-radius:6px;
    box-shadow:inset 0 1px 0 rgba(255,255,255,.06),0 2px 0 #0a0a0a;text-align:left;cursor:pointer;
    transition:transform .06s,box-shadow .06s,border-color .1s;
  }
  .fix-card:hover{border-color:var(--navy2)}
  .fix-card:active{transform:translateY(2px);box-shadow:inset 0 1px 0 rgba(255,255,255,.03),0 0 0 #0a0a0a}
  .fix-card h4{font-family:var(--disp);font-weight:700;font-size:14px;text-transform:uppercase;color:var(--text);margin:0 0 4px}
  .fix-card p{font-family:var(--body);font-size:13.5px;color:var(--prose);line-height:1.5;margin:0}

  @media (prefers-reduced-motion:reduce){ .nbtn,#main .btn,.fix-card{transition:none} }

  /* ═══════════ Design system v2 : sidebar, Bono, misc ═══════════ */
  /* sidebar groups + items */
  .group h2{font-family:var(--disp);font-weight:600;font-size:12px;letter-spacing:.2em;text-transform:uppercase;color:var(--lbl);padding:0 18px 6px}
  .group button{
    font-family:var(--body);font-size:14.5px;color:var(--prose);padding:8px 18px 8px 15px;
    border-left:3px solid transparent;border-radius:0;
  }
  .group button:hover{background:#1c1c1c;color:#fff}
  .group button.active{
    background:var(--well);color:#fff;font-weight:600;border-left-color:var(--amber);
    box-shadow:inset 0 2px 6px rgba(0,0,0,.7);
  }
  .group button.linked{color:var(--loose)}
  .hyper-toggle{
    border-radius:5px;background:linear-gradient(#2b2b2b,#1c1c1c);border:1px solid #3a3a3a;color:var(--lbl-hi);
    box-shadow:inset 0 1px 0 rgba(255,255,255,.10),0 2px 0 #000;font-family:var(--disp);font-weight:600;
    font-size:11.5px;letter-spacing:.08em;padding:5px 11px;transition:transform .06s,box-shadow .06s;
  }
  .hyper-toggle:hover{border-color:var(--navy2);color:#fff}
  .hyper-toggle:active{transform:translateY(2px);box-shadow:inset 0 1px 0 rgba(255,255,255,.04),0 0 0 #000}
  /* sidebar brand */
  .brand h1{font-family:var(--disp);font-weight:700;letter-spacing:.02em}
  .brand p{font-family:var(--body);color:var(--lbl);font-size:12.5px}

  /* legacy page chrome still used by Bono + fuel: crumb + title */
  .crumb{font-family:var(--disp);font-weight:600;font-size:12.5px;letter-spacing:.2em;text-transform:uppercase;color:var(--lbl)}
  .title-row h2{font-family:var(--disp);font-weight:700;font-size:30px;text-transform:uppercase;letter-spacing:0}

  /* Bono chat */
  .chat-log{gap:10px}
  .msg{border-radius:8px;font-family:var(--body);font-size:15px;line-height:1.55;color:var(--prose)}
  .msg.user{background:linear-gradient(#1c1c1c,#161616);border:1px solid var(--line);box-shadow:inset 0 1px 0 rgba(255,255,255,.06),0 2px 0 #0a0a0a;color:var(--text)}
  .msg.ai{background:var(--well);border:1px solid var(--well-line);border-left:3px solid var(--amber);box-shadow:inset 0 2px 6px rgba(0,0,0,.7)}
  .msg.err{background:var(--well);border:1px solid var(--loose);border-left:3px solid var(--loose);color:var(--loose);box-shadow:inset 0 2px 6px rgba(0,0,0,.7)}
  .chat-empty{font-family:var(--body);font-size:15px;color:var(--prose);line-height:1.55}
  .chat-empty .ex{display:flex;flex-direction:column;gap:8px;margin-top:14px}
  .chat-empty .ex button{
    text-align:left;background:linear-gradient(#2b2b2b,#1c1c1c);border:1px solid #3a3a3a;border-radius:5px;
    box-shadow:inset 0 1px 0 rgba(255,255,255,.10),0 2px 0 #000;color:var(--lbl-hi);font-family:var(--body);
    font-size:14px;padding:8px 12px;cursor:pointer;transition:transform .06s,box-shadow .06s,border-color .1s;
  }
  .chat-empty .ex button:hover{border-color:var(--navy2);color:#fff}
  .chat-empty .ex button:active{transform:translateY(2px);box-shadow:inset 0 1px 0 rgba(255,255,255,.04),0 0 0 #000}
  .setup-picker{display:flex;align-items:center;gap:8px;flex-wrap:wrap;padding:10px 0}
  .sp-label{font-family:var(--disp);font-weight:600;font-size:12.5px;letter-spacing:.1em;text-transform:uppercase;color:var(--lbl)}
  .sp-hint{font-family:var(--body);font-size:13.5px;color:var(--lbl);line-height:1.5;flex:1;min-width:220px}
  .setup-picker select{
    background:var(--well);border:1px solid var(--well-line);border-radius:6px;color:var(--text);
    box-shadow:inset 0 2px 6px rgba(0,0,0,.7);font-family:var(--num);font-size:14px;padding:6px 10px;
  }
  .setup-picker select:disabled{color:var(--lbl);opacity:.7}
  .setup-picker button,#spInsert,#spReload{
    background:linear-gradient(#2b2b2b,#1c1c1c);border:1px solid #3a3a3a;border-radius:5px;
    box-shadow:inset 0 1px 0 rgba(255,255,255,.10),0 2px 0 #000;color:var(--lbl-hi);font-family:var(--disp);
    font-weight:600;font-size:12.5px;letter-spacing:.08em;text-transform:uppercase;padding:6px 12px;cursor:pointer;
    transition:transform .06s,box-shadow .06s,border-color .1s;
  }
  .setup-picker button:hover{border-color:var(--navy2);color:#fff}
  .setup-picker button:active{transform:translateY(2px);box-shadow:inset 0 1px 0 rgba(255,255,255,.04),0 0 0 #000}
  .setup-picker button:disabled{opacity:.45;transform:none}
  .chat-tools{font-family:var(--body);font-size:13.5px;color:var(--lbl)}
  .chat-tools label{display:inline-flex;align-items:center;gap:8px}
  .chat-input{border-top:1px solid var(--line);padding-top:12px;align-items:flex-end}
  .chat-input textarea{
    background:var(--well);border:1px solid var(--well-line);border-radius:6px;box-shadow:inset 0 2px 6px rgba(0,0,0,.7);
    font-family:var(--body);font-size:15px;color:var(--text);
  }
  .chat-input textarea:focus{border-color:var(--navy2);outline:none}
  .chat-input .btn{align-self:stretch}
  /* typing dots keep their reduced-motion rule; just recolour */
  .typing span{background:var(--lbl)}

  /* fallback / connection screens */
  .fallback{max-width:58ch}
  .fallback .icon{font-size:0;margin-bottom:16px}
  .fallback .icon svg{width:44px;height:44px;stroke:var(--lbl-hi);fill:none;stroke-width:1.75;stroke-linecap:round;stroke-linejoin:round}
  .fallback h3{font-family:var(--disp);font-weight:700;font-size:26px;letter-spacing:0}
  .fallback p{font-family:var(--body);font-size:15px;color:var(--prose);line-height:1.55}
  .fallback ol{font-family:var(--body);font-size:14.5px;color:var(--prose);line-height:1.7}
  .fallback ol li::marker{color:var(--amber);font-family:var(--disp);font-weight:700}
  .fallback code{background:var(--well);border:1px solid var(--well-line);border-radius:4px;box-shadow:inset 0 1px 3px rgba(0,0,0,.6);font-family:var(--num);font-size:13px;padding:1px 7px;color:var(--text)}
  .fallback a{color:var(--navy-txt)}

  /* warnings (Kunos compare/evo notes) */
  .warn{
    display:flex;gap:10px;align-items:flex-start;background:var(--well);border:1px solid var(--well-line);border-left:3px solid var(--loose);
    border-radius:6px;box-shadow:inset 0 2px 6px rgba(0,0,0,.7);padding:10px 12px;font-family:var(--body);font-size:14px;color:var(--prose);line-height:1.5;
  }
  .warn svg{width:16px;height:16px;flex:0 0 16px;margin-top:2px;stroke:var(--loose);fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
  @media (prefers-reduced-motion:reduce){ .hyper-toggle,.chat-empty .ex button,.setup-picker button{transition:none} }

  /* Bono: stop button and stopped marker */
  #main .btn.stop{background:var(--well);border-color:var(--amber);color:#fff}
  #main .btn.stop:hover{background:var(--amber);border-color:var(--amber)}
  .msg .stopped{display:block;margin-top:8px;font-family:var(--disp);font-weight:600;font-size:11.5px;letter-spacing:.14em;text-transform:uppercase;color:var(--lbl)}
  .chat-tools .tools-note{color:var(--lbl)}
</style>
</head>
<body>
<div class="app">
  <nav id="nav"></nav>
  <div style="flex:1;min-width:0">
    <div class="mobile-nav">
      <div class="brand"><h1>Setup Ripple <span>LMU</span></h1><p>Hypercar · LMP · GT3 cause &amp; effect. Le Mans Ultimate · v2.1</p></div>
      <div id="mTabs"></div>
      <select id="mobileSel" aria-label="Choose a setup parameter or symptom"></select>
    </div>
    <main id="main"></main>
  </div>
</div>

<script>
const P = [
/* ───────────────────────── TYRES ───────────────────────── */
{id:'pressure',group:'Tyres',name:'Tyre pressures',
 upLabel:'Raise',downLabel:'Lower',
 does:'Set the size and shape of the contact patch. The single biggest grip factor. LMU works in kPa, and you are chasing a hot-pressure window (broadly the low-to-mid 130s kPa front and rear on most LMU slicks, but it varies by car and compound. Watch the tyre temps and the feel, not just the number). Pressures climb as the tyre heats, so set them cold and judge them hot.',
 up:{bal:0,fx:[
  'Smaller contact patch once over the window. Less grip at that end of the car',
  'Centre of the tread overheats first; slides get snappier, less progressive',
  'Slightly sharper initial steering response and lower rolling resistance',
  'Per axle: high rears only = looser car; high fronts only = tighter car'],
  comp:[
   {id:'brakeDucts',a:'Open the brake ducts a step. Brake heat soaks into the rim and is often why pressures creep high'},
   {id:'camber',a:'Check camber: too much inner-edge temperature drags the whole pressure up'}]},
 down:{bal:0,fx:[
  'Below the window the carcass flexes. Vague, mushy response and the shoulders overheat',
  'Takes longer to switch the tyre on at the start of a stint',
  'Per axle: low rears = sluggish but planted rear; low fronts = lazy turn-in'],
  comp:[
   {id:'brakeDucts',a:'Close the ducts a step to push more heat into the rims and lift pressures'}]},
 knock:[
  {id:'brakeDucts',why:'Duct openings are your main in-race pressure control. Heat from the discs feeds straight into the rims'},
  {id:'camber',why:'Camber decides how temperature spreads across the tread, which feeds back into pressure'},
  {id:'rideHeightF',why:'Pressure changes alter tyre radius slightly, nudging ride height and rake'}],
 note:'Track temp and fuel burn both move pressures across a stint. A setup that is perfect on lap 2 may be over the window by lap 15.'},

{id:'camber',group:'Tyres',name:'Camber',
 upLabel:'More negative',downLabel:'Less negative',
 does:'Tilts the top of the tyre inwards so the tread sits flat when the car rolls in a corner. You are trading mid-corner grip against straight-line braking and traction.',
 up:{bal:0,fx:[
  'More mid-corner grip at that axle as the tread loads evenly under roll',
  'Inner-edge temperature climbs. Watch the I/M/O spread (aim for roughly even, inner slightly warmer)',
  'Less braking and traction grip in a straight line (smaller upright contact patch)',
  'Per axle: more front camber = sharper, slightly looser mid-corner; more rear = more planted, tighter'],
  comp:[
   {id:'pressure',a:'Re-check hot pressures. The inner edge will be doing more work'},
   {id:'toe',a:'A touch less front toe-out offsets the extra scrub heat'}]},
 down:{bal:0,fx:[
  'Better braking and corner-exit traction, weaker mid-corner',
  'Outer shoulder takes more punishment in long corners',
  'More even wear on tracks with few fast corners'],
  comp:[
   {id:'arbF',a:'If mid-corner grip drops too far, soften the ARB at that end instead of adding camber back'}]},
 knock:[
  {id:'pressure',why:'Camber redistributes heat across the tread, which moves hot pressures'},
  {id:'caster',why:'Caster adds dynamic camber when steered. More caster lets you run less static camber'}],
 note:'LMU prototypes and GT3s generally like a little more negative camber at the front than the rear. Set it by the inner/mid/outer temp spread rather than chasing a fixed number, since it varies by car and track.'},

{id:'toe',group:'Tyres',name:'Toe',
 upLabel:'More toe',downLabel:'Less toe',
 does:'Angles the wheels relative to straight ahead. Convention: front toe-out for response, rear toe-in for stability. "More toe" here means more toe-out at the front or more toe-in at the rear.',
 up:{bal:1,fx:[
  'Front toe-out: sharper, more eager turn-in. The inside wheel is already pointing into the corner',
  'Rear toe-in: calmer, more planted corner exits and better stability over kerbs',
  'Both add scrub. More tyre temperature, more wear, a touch more drag',
  'Too much front toe-out makes the car nervous and darty in a straight line'],
  comp:[
   {id:'pressure',a:'Watch hot pressures rise from the extra scrub'},
   {id:'electronics',a:'With added rear toe-in you can often run one click less TC'}]},
 down:{bal:-1,fx:[
  'Straighter-running, lower drag, cooler tyres. Good for long straights and tyre life',
  'Lazier turn-in at the front; livelier (less damped) rear on exit',
  'Front toe near zero suits flowing tracks; tight tracks miss the response'],
  comp:[
   {id:'caster',a:'Add caster to recover some turn-in feel without the scrub penalty'},
   {id:'arbF',a:'A softer front ARB can also wake up turn-in'}]},
 knock:[
  {id:'pressure',why:'Toe scrub is a steady heat source. It shifts where your pressures settle'},
  {id:'caster',why:'Caster and front toe both shape turn-in; tune them together'}],
 note:'Balance shift shown is for the usual case (front response / rear stability traded together). Tune one axle at a time.'},

{id:'caster',group:'Tyres',name:'Caster',
 upLabel:'More',downLabel:'Less',
 does:'Tilts the steering axis backwards. More caster gains camber as you steer. Grip arrives exactly when you wind on lock, and strengthens self-centring.',
 up:{bal:1,fx:[
  'More dynamic camber mid-corner: front grip improves the more lock you carry',
  'Heavier, more communicative steering with stronger self-centring',
  'Slightly more stable under braking',
  'Usually low downside. Many setups run plenty of caster for the front grip'],
  comp:[
   {id:'camber',a:'You may be able to take out a little static camber and gain braking grip for free'}]},
 down:{bal:-1,fx:[
  'Lighter steering, weaker feedback',
  'Less camber gain. The front washes out earlier in long corners'],
  comp:[
   {id:'camber',a:'Add static camber back to recover mid-corner front grip'}]},
 knock:[
  {id:'camber',why:'Caster is camber-on-demand: the two budgets add together when steered'}],
 note:'Caster is close to a free upgrade for front grip on cars that expose it. Lower it mainly if steering weight bothers you. Note many LMU cars list caster as non-adjustable.'},

/* ───────────────────────── AERO ───────────────────────── */
{id:'rearWing',group:'Aero',name:'Rear wing',
 upLabel:'More wing',downLabel:'Less wing',
 does:'The big lever for rear downforce. Every step changes three things at once: rear grip at speed, drag, and the front-to-rear aero balance. Its effects grow with speed. It does almost nothing in a hairpin.',
 up:{bal:-2,fx:[
  'Rear planted in fast corners and under braking from high speed',
  'More drag. Top speed drops, fuel use rises slightly',
  'Aero balance moves rearwards: understeer builds the faster the corner',
  'Car becomes less pitch-sensitive. More forgiving over crests and kerbs at speed'],
  comp:[
   {id:'rideHeightF',a:'Lower the front (or raise the rear). More rake pulls aero balance forward again'},
   {id:'frontSplitter',a:'Add a splitter step if the car has one, to match the front to the new rear'},
   {id:'brakeBias',a:'Move bias rearwards ~0.5%. The rear can now take more braking load'},
   {id:'arbF',a:'Soften the front ARB a click to claw back grip in the slow corners the wing can\'t help'}]},
 down:{bal:2,fx:[
  'Top speed up. Strong on long straights and for defending',
  'Rear gets light in fast corners and under braking from speed',
  'Oversteer grows with speed; the car rewards smooth hands',
  'More pitch-sensitive: kerbs and bumps at speed unsettle it more'],
  comp:[
   {id:'brakeBias',a:'Move bias forward to protect the now-lighter rear under braking'},
   {id:'rideHeightR',a:'Drop the rear a touch (less rake) to push aero balance back'},
   {id:'arbR',a:'Soften the rear ARB so mechanical grip covers some of what the aero gave up'}]},
 knock:[
  {id:'rideHeightF',why:'Rake and wing together set the aero balance. Change one, re-check the other'},
  {id:'brakeBias',why:'Rear downforce decides how much braking the rear axle can take at speed'},
  {id:'springR',why:'More wing means more load crushing the rear at speed. The springs must hold the platform'},
  {id:'frontSplitter',why:'Front and rear aero are a matched pair; moving one strands the other'}],
 note:'Rule of thumb: if the balance problem appears only in fast corners, it\'s aero. If it\'s everywhere, look at mechanical grip first.'},

{id:'frontSplitter',group:'Aero',name:'Front splitter',
 upLabel:'More splitter',downLabel:'Less splitter',
 does:'Adds front downforce on cars that expose a front-aero adjustment (front wing position, splitter, or front diffuser, depending on the car). The front-end counterpart to the rear wing, and like the wing, it only works at speed.',
 up:{bal:2,fx:[
  'Front bites harder in fast corners. Turn-in at speed sharpens',
  'Aero balance moves forward: the rear becomes comparatively lighter',
  'Small drag increase',
  'Works harder the closer the front runs to the ground'],
  comp:[
   {id:'rearWing',a:'Add wing to keep the rear matched'},
   {id:'rideHeightF',a:'Raise the front slightly if high-speed oversteer appears'}]},
 down:{bal:-2,fx:[
  'High-speed understeer; the rear feels relatively more secure',
  'A touch less drag'],
  comp:[
   {id:'rearWing',a:'Trim a step of wing to re-centre the aero balance'}]},
 knock:[
  {id:'rearWing',why:'Splitter and wing set the two ends of the aero see-saw'},
  {id:'rideHeightF',why:'Splitter performance is very sensitive to front ride height'}],
 note:'If your car has no splitter setting, rake (ride heights) is your front-downforce tool instead.'},

{id:'rideHeightF',group:'Aero',name:'Front ride height',
 upLabel:'Raise',downLabel:'Lower',
 does:'With the rear height, this sets rake. The nose-down angle of the floor. More rake (lower front) means more front downforce. Lower also drops the centre of gravity. The catch: run too low and the car sits on its bumpstops.',
 up:{bal:-1,fx:[
  'Less rake. Aero balance shifts rearwards, high-speed understeer',
  'More suspension travel: friendlier over kerbs and bumps',
  'Slightly higher centre of gravity'],
  comp:[
   {id:'rearWing',a:'Trim a step of wing so the rear doesn\'t over-dominate the new balance'},
   {id:'rideHeightR',a:'Raise the rear by the same amount if you only wanted clearance, not a rake change'}]},
 down:{bal:2,fx:[
  'More rake. Front downforce up, sharper at speed',
  'Lower centre of gravity: a little less weight transfer everywhere',
  'Risk: bottoming onto the bumpstops mid-corner causes sudden, ugly understeer over bumps and kerbs'],
  comp:[
   {id:'bumpstops',a:'Stiffen or shorten bumpstop range so the platform stays controlled when it touches down'},
   {id:'springF',a:'Stiffer front springs help hold the car off the stops'},
   {id:'rearWing',a:'If it\'s now loose at speed, a step of wing rebalances it'}]},
 knock:[
  {id:'bumpstops',why:'The lower you run, the more the bumpstops become part of the active suspension'},
  {id:'frontSplitter',why:'Splitter downforce rises sharply as the front nears the ground'},
  {id:'springF',why:'Springs and ride height together decide whether the floor stays where you put it'},
  {id:'rearWing',why:'Rake and wing are the two halves of aero balance'}],
 note:'Low-and-stiff setups lean on this: maximum rake with the bumpstops doing real work to hold the aero platform.'},

{id:'rideHeightR',group:'Aero',name:'Rear ride height',
 upLabel:'Raise',downLabel:'Lower',
 does:'The other half of rake. Raising the rear tips the floor nose-down (more rake, more front aero) but lifts the centre of gravity at the driven axle.',
 up:{bal:1,fx:[
  'More rake. Aero balance forward, livelier at speed',
  'Higher rear CoG: a bit more weight transfer, slightly more squat and dive',
  'Diffuser/floor generally works the rake harder (car-dependent)'],
  comp:[
   {id:'rearWing',a:'A step of wing covers the rear if high-speed confidence drops'},
   {id:'springR',a:'Check rear springs. More transfer may want a touch more support'}]},
 down:{bal:-1,fx:[
  'Less rake, high-speed understeer tendency',
  'Lower CoG at the rear: traction off slow corners often improves',
  'Less travel before the rear bumpstops'],
  comp:[
   {id:'rideHeightF',a:'Lower the front too if you want the rake back with a lower car overall'}]},
 knock:[
  {id:'rideHeightF',why:'Rake is the difference between the two heights. They only mean something together'},
  {id:'rearWing',why:'Rake and wing trade against each other for the same aero balance'},
  {id:'springR',why:'Height changes shift how soon the rear reaches its bumpstops'}],
 note:'Tune rake in small steps. A few millimetres of rake change is clearly felt at 200 km/h.'},

/* ─────────────────── SUSPENSION & DAMPERS ─────────────────── */
{id:'springF',group:'Suspension & dampers',name:'Front springs',
 upLabel:'Stiffer',downLabel:'Softer',
 does:'Wheel rate at the front. Stiffness trades slow-corner mechanical grip against response and aero platform stability.',
 up:{bal:-1,fx:[
  'Sharper, more immediate turn-in response',
  'Less mechanical front grip. Understeer in slow corners',
  'Steadier front platform: splitter and rake work more consistently at speed (can make it *looser* in fast corners)',
  'Harsher over kerbs and bumps'],
  comp:[
   {id:'arbF',a:'Soften the front ARB to win back slow-corner grip while keeping the response'},
   {id:'dampers',a:'Re-match damper rates to the new spring. Stiffer springs want more damping'},
   {id:'rideHeightF',a:'You can often run a little lower now the spring holds the platform'}]},
 down:{bal:1,fx:[
  'More slow-corner front grip as the tyre stays loaded over bumps',
  'Lazier response; more dive under braking',
  'Front aero platform moves around more. Less consistent at speed'],
  comp:[
   {id:'dampers',a:'Soften front damping to match, or the spring can\'t do its job'},
   {id:'rideHeightF',a:'May need a touch more ride height to avoid the bumpstops'}]},
 knock:[
  {id:'dampers',why:'Dampers are tuned to the spring. Change one without the other and the wheel loses contact'},
  {id:'bumpstops',why:'Softer springs reach the stops sooner; stiffer springs may never use them'},
  {id:'rideHeightF',why:'Spring rate decides how far the car settles and how low you can safely run'}],
 note:'Mechanical grip rules below ~120 km/h; aero rules above. Decide which corners matter at this track before touching springs.'},

{id:'springR',group:'Suspension & dampers',name:'Rear springs',
 upLabel:'Stiffer',downLabel:'Softer',
 does:'Wheel rate at the rear, the traction axle. The classic trade: softer rear hooks up out of slow corners, stiffer rear holds the aero platform at speed.',
 up:{bal:1,fx:[
  'Less traction out of slow corners. Power oversteer appears earlier',
  'Steadier rear platform: more consistent downforce in fast corners',
  'Sharper response to throttle balance changes'],
  comp:[
   {id:'arbR',a:'Soften the rear ARB to recover some slow-corner traction'},
   {id:'electronics',a:'A click more TC papers over exit wheelspin while you test'},
   {id:'dampers',a:'Re-match rear damping'}]},
 down:{bal:-1,fx:[
  'Better drive off slow corners. The rear squats and grips',
  'More squat means more dynamic rake change: aero balance moves around on throttle',
  'Slightly tighter feel overall'],
  comp:[
   {id:'dampers',a:'Soften rear damping to suit'},
   {id:'rideHeightR',a:'Check the rear isn\'t now sitting on its bumpstops under load'}]},
 knock:[
  {id:'diffPreload',why:'Spring rate and diff locking both shape how the rear puts power down'},
  {id:'dampers',why:'Springs and dampers are one system'},
  {id:'rideHeightR',why:'Softer rear = more squat = the static height number means something different'}],
 note:''},

{id:'arbF',group:'Suspension & dampers',name:'Front anti-roll bar',
 upLabel:'Stiffer',downLabel:'Softer',
 does:'Resists body roll by tying the front wheels together. The cleanest mid-corner balance tool there is. It changes roll stiffness distribution without touching ride or aero.',
 up:{bal:-2,fx:[
  'Crisper, flatter turn-in',
  'More load forced through the outside front, mid-corner understeer',
  'Inside front stays more planted under braking'],
  comp:[
   {id:'arbR',a:'Stiffen the rear bar too if you wanted response, not a balance change'},
   {id:'camber',a:'The loaded outside front may want a touch more camber'}]},
 down:{bal:2,fx:[
  'More mid-corner front grip. The car rotates better',
  'Slower, softer initial response; more body roll',
  'Can feel lazy on quick direction changes (chicanes)'],
  comp:[
   {id:'dampers',a:'Slightly firmer front slow bump keeps transitions tidy despite the softer bar'}]},
 knock:[
  {id:'arbR',why:'Balance lives in the front/rear bar *ratio*. One bar alone is half the story'},
  {id:'springF',why:'Bars and springs both add roll stiffness; they overlap'}],
 note:'ARBs are the first thing to reach for when the balance problem is mid-corner, at all speeds.'},

{id:'arbR',group:'Suspension & dampers',name:'Rear anti-roll bar',
 upLabel:'Stiffer',downLabel:'Softer',
 does:'The rear half of the roll-stiffness ratio. Strongly shapes on-throttle behaviour from mid-corner to exit.',
 up:{bal:2,fx:[
  'Car rotates more. Oversteer, especially on throttle from mid-corner',
  'Flatter, more responsive rear in direction changes',
  'Inside rear unloads more: worse traction out of slow corners'],
  comp:[
   {id:'diffPreload',a:'A little more preload can steady the rear on throttle pickup'},
   {id:'electronics',a:'One more click of TC while you learn the new balance'}]},
 down:{bal:-2,fx:[
  'More traction and a calmer rear on exit',
  'More roll; slightly lazier in chicanes',
  'Mild understeer tendency mid-corner'],
  comp:[
   {id:'arbF',a:'Soften the front bar too if you only wanted traction, not push'}]},
 knock:[
  {id:'arbF',why:'It\'s the ratio between bars that sets balance'},
  {id:'diffPreload',why:'Both control how the rear behaves under power'}],
 note:''},

{id:'dampers',group:'Suspension & dampers',name:'Dampers (bump / rebound)',
 upLabel:'Stiffer',downLabel:'Softer',
 does:'Dampers don\'t change how much weight transfers, only how fast. Slow bump/rebound shape braking, turn-in and throttle transitions; fast bump/rebound handle kerbs and bumps. They are your transient balance tool.',
 up:{bal:0,fx:[
  'Weight transfer slows down: calmer, more deliberate transitions',
  'Stiffer front bump = less dive, lazier turn-in (entry understeer)',
  'Stiffer rear rebound = rear held down on throttle, steadier exits',
  'Stiffer fast damping = harsh over kerbs; the wheel can skip and lose contact'],
  comp:[
   {id:'springF',a:'Damping should track spring rate. If you\'re maxing dampers, the spring is wrong'},
   {id:'bumpstops',a:'On kerb-heavy tracks, let fast damping stay soft and use bumpstops for the platform'}]},
 down:{bal:0,fx:[
  'Faster weight transfer: livelier turn-in, more dive and squat',
  'Better kerb absorption and bumpy-track compliance',
  'Too soft and the car floats. Balance becomes vague and delayed'],
  comp:[
   {id:'arbF',a:'If the car got too eager on entry, a stiffer front bar steadies it without slowing the dampers again'}]},
 knock:[
  {id:'springF',why:'Each spring rate has a damping range that suits it'},
  {id:'bumpstops',why:'Fast damping and bumpstops share the job of kerbs and bottoming'}],
 note:'Diagnose dampers by *when* the problem happens: entry/exit transitions = slow damping; kerbs and bumps = fast damping; steady mid-corner = not the dampers.'},

{id:'bumpstops',group:'Suspension & dampers',name:'Bumpstops (rate / range)',
 upLabel:'Stiffer / less range',downLabel:'Softer / more range',
 does:'Secondary springs that catch the suspension at the end of its travel. In a low-and-stiff setup they\'re not just a safety net. They become an aero-platform tool the car deliberately rides on.',
 up:{bal:0,fx:[
  'Car rides the stops sooner/harder: very consistent aero platform at speed',
  'Sudden balance change the instant one end hits. Can feel like a wall of understeer (front) or a snap (rear)',
  'Harsh over kerbs'],
  comp:[
   {id:'rideHeightF',a:'Tune ride height so the stops engage where you want them to, not by accident'},
   {id:'springF',a:'Main spring and stop share the load. Set them as a pair'}]},
 down:{bal:0,fx:[
  'More usable travel, friendlier kerbs',
  'Aero platform floats more at speed, less consistent downforce',
  'Risk of harsh bottoming if you\'re running very low'],
  comp:[
   {id:'rideHeightF',a:'Raise slightly if the floor is slamming down on compressions'}]},
 knock:[
  {id:'rideHeightF',why:'Ride height decides when the stops engage'},
  {id:'springF',why:'Total wheel rate = spring + engaged bumpstop'},
  {id:'dampers',why:'Fast damping and stops both manage big hits'}],
 note:'If the balance changes *suddenly* at one speed or one compression, suspect a bumpstop engaging.'},

/* ───────────────────────── BRAKES ───────────────────────── */
{id:'brakeBias',group:'Brakes',name:'Brake bias',
 upLabel:'Forward',downLabel:'Rearward',
 does:'Splits braking force front/rear. The fastest balance change in the car. And the one you can adjust from the wheel mid-stint. Its effect is speed-sensitive, because at high speed the wing is pressing the rear down.',
 up:{bal:-1,fx:[
  'Stable, predictable braking; the rear stays in line',
  'Front lockup risk rises, especially as the fronts wear',
  'Understeer on corner entry under trail-braking. The car resists rotation'],
  comp:[
   {id:'electronics',a:'A click less ABS can recover some front bite if lockups aren\'t the issue'},
   {id:'arbF',a:'Softer front bar restores some entry rotation'}]},
 down:{bal:1,fx:[
  'Car rotates into the corner under trail-braking, great for hairpins',
  'Rear lockup / snap risk under hard braking, worst at low speed where the wing isn\'t helping',
  'Less margin in panic stops and on cold tyres'],
  comp:[
   {id:'rearWing',a:'More wing makes rearward bias safer at speed (but not in slow corners)'},
   {id:'electronics',a:'A click more ABS adds a safety net while you adapt'}]},
 knock:[
  {id:'rearWing',why:'Rear downforce sets how much braking the rear can take. Bias and wing move together'},
  {id:'electronics',why:'ABS decides how forgiving each bias setting is'},
  {id:'diffPreload',why:'Off-throttle diff locking also shapes entry rotation, they stack'}],
 note:'Typical GT3 window is roughly 55–62% forward. Move it in 0.5% steps and re-judge after a few laps, not one corner.'},

{id:'brakePressure',group:'Brakes',name:'Brake pressure',
 upLabel:'Higher',downLabel:'Lower',
 does:'Sets how much of your pedal travel reaches the calipers. At 100%, full pedal gives full clamping force. The right number depends almost entirely on one question: does the car have ABS? LMGT3 does. Hypercar, LMP2 and LMP3 do not. Without ABS, full pressure locks a wheel the instant grip runs out. And grip runs out progressively through a braking zone, because the downforce that was pinning the tyres bleeds away as you slow.',
 up:{bal:0,fx:[
  'Shorter stops while the tyres can take it. More of the pedal is doing useful work',
  'Without ABS: lockup risk climbs steeply, and it is worst at the end of the zone where the wing has stopped helping',
  'Less modulation. The pedal becomes an on/off switch rather than a dial'],
  comp:[
   {id:'brakeBias',a:'If you raise pressure, a touch more forward bias protects the rear, which locks first at low speed'},
   {id:'electronics',a:'On a car with ABS, higher pressure is safe. The system does the modulating for you'}]},
 down:{bal:0,fx:[
  'More modulation. A usable range under your foot instead of a cliff edge',
  'Far fewer lockups on no-ABS cars; the tyre sits just below the slip peak',
  'Slightly longer stops if you go too low. You are leaving clamping force on the table'],
  comp:[
   {id:'brakeMigration',a:'On a Hypercar, pair lower pressure with the migration setting. Both are managing the same wing-fade problem'},
   {id:'brakeBias',a:'Lower pressure lets you run slightly more rearward bias without the snap'}]},
 knock:[
  {id:'electronics',why:'ABS is the whole question. With it, pressure barely matters; without it, your pressure setting is your ABS'},
  {id:'brakeBias',why:'Pressure sets how hard you can brake, bias sets where. They are one system'},
  {id:'brakeMigration',why:'Migration shifts bias through the stop as the wing fades; pressure decides whether the fronts survive that shift'}],
 note:'No-ABS cars (Hypercar, LMP2, LMP3): most drivers settle somewhere around 70–85% and trail off the pedal early rather than standing on it. LMGT3 has ABS and can run high, though even there few people use the full 100%. Treat these as starting points, not targets. Car, track, tyre temperature and your own pedal all move the number.'},

{id:'brakeDucts',group:'Brakes',name:'Brake ducts',
 upLabel:'More open',downLabel:'More closed',
 does:'Cooling for discs and pads. But their stealth role is tyre pressure control, because brake heat soaks through the rim into the air in the tyre.',
 up:{bal:0,fx:[
  'Cooler brakes: consistent pedal, less pad wear over a stint',
  'Tyre pressures settle lower as the rims run cooler (the exact kPa per step varies by car)',
  'A little more drag; brakes and tyres take longer to warm up'],
  comp:[
   {id:'pressure',a:'Raise cold pressures to land in the same hot window'}]},
 down:{bal:0,fx:[
  'Faster warm-up. Good for short stints, qualifying and cold tracks',
  'Pressures settle higher; fade and pad wear risk in long stints',
  'Slightly less drag'],
  comp:[
   {id:'pressure',a:'Drop cold pressures to compensate for the extra rim heat'}]},
 knock:[
  {id:'pressure',why:'Duct steps are effectively a pressure adjustment you can plan a stint around'},
  {id:'brakeBias',why:'Brake temperature changes pedal feel and bite, which changes how a given bias behaves'}],
 note:'Duct (and radiator) openings are one of the few "free" tools for managing temperatures and pressures without touching the rest of the setup. LMU also exposes brake duct blanking front and rear.'},

/* ─────────────── DRIVETRAIN & ELECTRONICS ─────────────── */
{id:'diffPreload',group:'Drivetrain & electronics',name:'Differential preload',
 upLabel:'More',downLabel:'Less',
 does:'How strongly the diff resists a speed difference between the rear wheels before torque is even applied. It shapes the car in the *transitions*. Off-throttle into the corner, and the moment you pick the throttle back up.',
 up:{bal:-1,fx:[
  'More locked off-throttle: stable, planted entry that resists rotation (entry understeer)',
  'Stronger, more connected drive on throttle pickup',
  'On tight exits the locked axle can push wide. Or snap if grip runs out',
  'Smoother across throttle transitions overall'],
  comp:[
   {id:'brakeBias',a:'A touch rearward bias restores entry rotation the preload took away'},
   {id:'arbF',a:'Softer front bar also brings back rotation, mid-corner instead of entry'}]},
 down:{bal:1,fx:[
  'Car rotates freely off-throttle, agile, eager entries',
  'Throttle pickup feels looser; inside wheel spins up easier out of slow corners',
  'Can feel nervous in fast lift-off moments'],
  comp:[
   {id:'electronics',a:'A click more TC covers the looser throttle pickup'},
   {id:'springR',a:'Slightly softer rear springs add traction to compensate'}]},
 knock:[
  {id:'brakeBias',why:'Both shape entry rotation. Set them as a pair'},
  {id:'electronics',why:'TC and the diff fight over the same wheelspin'},
  {id:'arbR',why:'Rear roll stiffness changes how loaded each rear wheel is, which changes what the diff sees'}],
 note:'Test preload in the slowest corner on the track. That\'s where its character is loudest.'},

{id:'diffPower',group:'Drivetrain & electronics',name:'Differential power',
 upLabel:'More lock',downLabel:'Less lock',
 does:'How hard the rear diff locks under throttle. Preload sets the baseline; power lock adds to it the harder you accelerate. Locked, the diff drives the loaded outside rear harder than the inside one, and that difference swings the car round, most noticeably in first to third gear corners. Some cars show it as a ramp angle, where a lower angle locks more.',
 up:{bal:1,fx:[
  'Car rotates more on throttle: the outside rear drives it round',
  'Inside rear stops spinning up on its own',
  'Rear can step out as the power goes down, especially in slow corners',
  'Strong, connected drive once the car is straight'],
  comp:[
   {id:'electronics',a:'A click more TC catches the rear if it now steps out on exit'},
   {id:'springR',a:'Slightly softer rear springs help the rear hook up again'}]},
 down:{bal:-1,fx:[
  'Calmer, more stable exits: the rear stays behind you',
  'Car rotates less on throttle and can push wide on tight exits',
  'Inside rear can spin up on its own out of slow corners'],
  comp:[
   {id:'diffPreload',a:'A touch more preload stops the inside wheel spinning alone'},
   {id:'arbF',a:'A softer front bar helps the nose keep turning on power'}]},
 knock:[
  {id:'diffPreload',why:'Preload is the baseline lock and power adds to it under throttle, so read them together'},
  {id:'electronics',why:'TC and the diff are both managing wheelspin, so set them as a pair'},
  {id:'diffCoast',why:'Coast shapes the entry, power the exit. Change one and re-check the other'}],
 note:'Judge it on the exit of the slowest corner on the track. If the car swings round as you open the throttle, take lock away; if it won\'t turn on power and the inside wheel spins alone, add some.'},

{id:'diffCoast',group:'Drivetrain & electronics',name:'Differential coast',
 upLabel:'More lock',downLabel:'Less lock',
 does:'How hard the rear diff locks off the throttle: braking, trail-braking and turn-in. More lock ties the rear wheels together and keeps the rear planted; less lets the car rotate into the corner. Some cars show it as a ramp angle, where a lower angle locks more.',
 up:{bal:-1,fx:[
  'Stable, planted rear under braking and turn-in',
  'Resists rotation on entry and can bring entry understeer',
  'Calmer over kerbs and bumps off the throttle'],
  comp:[
   {id:'brakeBias',a:'A touch of rearward bias gives back some entry rotation'},
   {id:'arbF',a:'A softer front bar helps the nose turn in'}]},
 down:{bal:1,fx:[
  'Car rotates more freely into the corner',
  'Rear can get nervous or snap under trail-braking',
  'Rewards a smooth release of the brake'],
  comp:[
   {id:'brakeBias',a:'Move bias forward a touch if the rear gets nervous under braking'},
   {id:'brakeMigration',a:'On Hypercars, migration can steady the rear as you trail off the brake'}]},
 knock:[
  {id:'brakeBias',why:'Both shape how the car rotates on entry, so set them as a pair'},
  {id:'diffPreload',why:'Preload is the baseline and coast lock adds to it off the throttle'},
  {id:'diffPower',why:'Coast shapes the entry, power the exit'}],
 note:'Test it in a slow corner with a long braking zone. That is where coast lock shows most.'},

{id:'electronics',group:'Drivetrain & electronics',name:'TC & ABS',
 upLabel:'More assist',downLabel:'Less assist',
 does:'Traction control limits wheelspin; ABS limits lockup. Crucial honesty check: they mask balance problems rather than fix them. If you need lots of TC, the setup (or your right foot) has an exit problem.',
 up:{bal:0,fx:[
  'Safer, more repeatable exits and braking zones; less tyre wear over a stint',
  'Over-set TC cuts power and costs real exit speed',
  'Over-set ABS lengthens braking distances slightly',
  'Hides what the chassis is actually doing, bad for learning'],
  comp:[
   {id:'diffPreload',a:'If you keep needing more TC, the real fix is often diff/springs at the rear'}]},
 down:{bal:0,fx:[
  'Faster exits and shorter stops *if* the chassis and your inputs are clean',
  'Wheelspin and lockup punish mistakes immediately',
  'More tyre wear when you get it wrong'],
  comp:[
   {id:'springR',a:'Softer rear springs / ARB make low TC liveable'},
   {id:'toe',a:'A touch more rear toe-in steadies exits without electronic help'}]},
 knock:[
  {id:'diffPreload',why:'Diff locking and TC manage the same exit wheelspin from opposite ends'},
  {id:'brakeBias',why:'ABS level changes how aggressive a bias setting you can run'},
  {id:'pressure',why:'Less assist = more sliding = more tyre temperature'}],
 note:'When learning setups, run TC one click lower than comfortable for a session. You\'ll *feel* what every change does instead of having it filtered.'}
,

/* ─────────────── LMU-SPECIFIC: HYBRID, ENERGY & PROTOTYPE DIFF ─────────────── */
{id:'virtualEnergy',group:'Energy & hybrid',name:'Virtual Energy',
 upLabel:'More energy',downLabel:'Less energy',
 does:'WEC/LMU run to an energy allocation, not just a fuel tank. Virtual Energy is the percentage of your stint allocation loaded. It ties together fuel and hybrid deployment into one "how far can I go" number. Set it to 100% and let Fuel Ratio do the fine work; the game shows the lap count it buys.',
 up:{bal:0,fx:[
