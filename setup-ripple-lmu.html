  'More laps before you must refuel/recharge. Fewer stops over a race',
  'More weight on board early in the stint: slightly slower, more tyre load',
  'Gives you margin if a safety car or mistake changes the fuel maths'],
  comp:[
   {id:'fuelRatio',a:'Trim Fuel Ratio if the extra energy makes the car heavier than the stint needs'}]},
 down:{bal:0,fx:[
  'Lighter car, quicker lap. Good for qualifying or a short sprint',
  'Less margin: run the number too low and you won\'t reach the flag or the next stop',
  'Forces more lift-and-coast or a higher deployment map to stretch it'],
  comp:[
   {id:'fuelRatio',a:'Match Fuel Ratio to the energy you actually carry so the two agree'}]},
 knock:[
  {id:'fuelRatio',why:'Energy and fuel are two views of the same stint plan, set them together'},
  {id:'regen',why:'How aggressively you harvest changes how far a given energy load lasts'}],
 note:'Non-hybrid classes (LMP2, LMP3) have no Virtual Energy. They just carry litres, set via the fuel control.'},

{id:'fuelRatio',group:'Energy & hybrid',name:'Fuel Ratio',
 upLabel:'Richer / more',downLabel:'Leaner / less',
 does:'On hybrids, Fuel Ratio meters how much fuel goes in to match your energy plan. The game shows the litres carried beside it. On LMP2/LMP3 the same control simply sets litres directly. It is your fine fuel adjustment once Virtual Energy is at 100%.',
 up:{bal:0,fx:[
  'More litres on board: longer stint, more early-stint weight',
  'Heavier car blunts traction and braking slightly until it burns down',
  'Useful to cover an extra lap if strategy is marginal'],
  comp:[
   {id:'virtualEnergy',a:'Keep Virtual Energy at 100% and use this as the litres fine-tune'}]},
 down:{bal:0,fx:[
  'Lighter, faster car, qualifying trim',
  'Shorter stint; risk of running dry if you misjudge consumption',
  'The car comes alive as fuel burns off regardless. Plan for the lap-1 weight'],
  comp:[
   {id:'brakeBias',a:'A heavy fuel load shifts weight rearward slightly. You may want a touch more front bias early'}]},
 knock:[
  {id:'virtualEnergy',why:'Litres and energy allocation describe the same stint, they must agree'}],
 note:'Always plan fuel from a real consumption figure (the MFD or a test stint), not a guess. The fuel calculator on the Engineer tab helps.'},

{id:'regen',hyperOnly:true,group:'Energy & hybrid',name:'Regen level',
 upLabel:'More harvest',downLabel:'Less harvest',
 does:'Hybrid Hypercars only. The non-hybrid LMH cars (Valkyrie, Glickenhaus, Vanwall) have no regen at all. Sets how hard the car harvests energy under braking to refill the hybrid system. More harvest stretches your energy but adds a braking drag at the driven axle that changes the car\'s feel on the way into a corner. Which axle that is depends on the car: LMDh harvests through the rear, so heavy regen acts like extra rearward brake bias; the front-hybrid LMH cars (Ferrari, Toyota, Peugeot) harvest through the front, which loads the nose instead. Per-car: the kW step size differs between cars, so judge it by feel and energy, not the number.',
 up:{bal:0,fx:[
  'Refills hybrid energy faster. Supports a more aggressive deploy map or a longer stint',
  'Adds engine/MGU braking at the harvest axle: can tug the balance under braking',
  'On front-axle-harvest cars, strong regen can nudge the nose into the corner',
  'Heat and wear into the harvest-axle tyres rise slightly'],
  comp:[
   {id:'brakeBias',a:'Re-check brake bias. Regen braking stacks on top of the friction brakes at that axle'},
   {id:'motorMap',a:'A stronger deploy map spends what the harvest brings in, balance the two'}]},
 down:{bal:0,fx:[
  'Cleaner, more neutral braking feel. Fewer hybrid effects on entry',
  'Less energy recovered: you must lift-and-coast more or deploy less to reach the flag',
  'Easier to drive consistently if the harvest braking was unsettling you'],
  comp:[
   {id:'virtualEnergy',a:'If you harvest less, you may need to carry more energy to cover the stint'}]},
 knock:[
  {id:'motorMap',why:'Harvest fills the battery, the deploy map empties it. Set them as a pair'},
  {id:'brakeBias',why:'Regen braking changes the effective bias at the harvest axle'},
  {id:'virtualEnergy',why:'Harvest rate decides how far a given energy allocation stretches'}],
 note:'Step sizes for regen vary by car (e.g. 20 kW per click on one car, 17 on another). Never assume; step it and read the displayed value.'},

{id:'motorMap',hyperOnly:true,group:'Energy & hybrid',name:'Electric motor map',
 upLabel:'More deploy',downLabel:'Less deploy',
 does:'Hybrid Hypercars only. The non-hybrid LMH cars have no deploy. Chooses how much electric power the hybrid deploys. The spending side of the energy budget that Regen fills. On an LMDh the deploy goes through the rear axle; on a front-hybrid LMH it goes through the front, which is why those cars can feel four-wheel-drive out of slow corners. More deploy means stronger acceleration where the car is allowed to use it, at the cost of draining energy faster.',
 up:{bal:0,fx:[
  'Stronger acceleration / corner exit where deployment is allowed',
  'Drains hybrid energy faster. Needs more harvest or more allocation to last',
  'On front-axle-deploy cars, power deployment can add corner-exit stability or push',
  'More demand on rear traction at exit if the deploy goes to the rear'],
  comp:[
   {id:'regen',a:'Lift harvest to keep up with the faster drain'},
   {id:'electronics',a:'A click more TC if the extra deploy lights up the rear on exit'}]},
 down:{bal:0,fx:[
  'Gentler power delivery. Energy lasts longer, easier on rear traction',
  'Slower out of corners where you could have used the boost',
  'Simpler to drive while you learn the car'],
  comp:[
   {id:'regen',a:'You can harvest a little less too, keeping the energy balance even'}]},
 knock:[
  {id:'regen',why:'Deploy and harvest are the two halves of the energy loop'},
  {id:'virtualEnergy',why:'A hotter deploy map empties your allocation sooner'}],
 note:'Step sizes vary per car here too (e.g. 20 kW vs 10 kW per click). Read the displayed value rather than assuming.'},

{id:'frontDiff',hyperOnly:true,group:'Drivetrain & electronics',name:'Front differential (Hypercar)',
 upLabel:'More lock',downLabel:'Less lock',
 does:'Front-drive-axle Hypercars expose a front diff (power, coast and preload) on top of the rear. It shapes how the front axle puts down hybrid/engine torque and how it behaves trailing off the throttle. A handling tool the GT3s and LMPs don\'t have.',
 up:{bal:-1,fx:[
  'More front-axle locking: steadier front under power on deploy, but more understeer as both front wheels tie together',
  'Coast side: more locking calms the front entering a corked off-throttle',
  'Can mask front mechanical grip problems rather than fix them'],
  comp:[
   {id:'arbF',a:'Soften the front ARB to recover the mid-corner rotation the lock takes away'},
   {id:'motorMap',a:'Front deploy and front diff interact. Re-check exit feel after changing either'}]},
 down:{bal:1,fx:[
  'Freer front axle: more rotation, livelier turn-in, but more torque-steer/instability under front deploy',
  'Less predictable on bumpy front-axle exits',
  'Rewards smooth throttle on the way out'],
  comp:[
   {id:'electronics',a:'A click more TC steadies things while you test a freer front diff'}]},
 knock:[
  {id:'diffPreload',why:'Front and rear diff behaviour combine into the overall on/off-throttle balance'},
  {id:'motorMap',why:'On front-deploy cars, the diff decides how that power axle behaves'}],
 note:'Only the front-hybrid LMH cars (Ferrari 499P, Toyota GR010/TR010, Peugeot 9X8) drive through the front axle. On every other car the front diff does nothing, so the Engineer shows it as Non-adjustable. The Engineer badge tells you which you have.'},

{id:'brakeMigration',group:'Brakes',name:'Brake migration',
 upLabel:'More migration',downLabel:'Less migration',
 does:'Shifts brake bias forward as you bleed off the pedal through a braking zone. More front bias on initial hard braking, migrating rearward as you trail off. Lets you run a stable-on-initial, rotational-on-release brake feel that a single fixed bias can\'t.',
 up:{bal:1,fx:[
  'More forward bias at the top of the brake zone: stable, lock-resistant initial braking',
  'As you trail off, bias moves rearward. Helps the car rotate towards the apex',
  'Too much can make the rear feel like it wakes up unexpectedly mid-release'],
  comp:[
   {id:'brakeBias',a:'Set your base bias first, then add migration for the trail-braking phase'}]},
 down:{bal:-1,fx:[
  'Bias stays closer to fixed through the zone, simpler, more predictable',
  'Less help rotating the car on brake release',
  'Better if migration was making the rear nervous'],
  comp:[
   {id:'brakeBias',a:'Without migration you may want a touch less base front bias for entry rotation'}]},
 knock:[
  {id:'brakeBias',why:'Migration moves *around* your base bias, they\'re set together'},
  {id:'electronics',why:'ABS changes how much migration you can run before the rear locks'}],
 note:'A little migration goes a long way. Add it in single clicks and feel the brake-release phase specifically. On a hybrid car, remember regen is also braking at the driven axle, so the two stack: LMDh regen adds rear effort, front-hybrid LMH regen adds front.'},

{id:'thirdSpring',group:'Suspension & dampers',name:'3rd spring / heave (Hypercar/LMP)',
 upLabel:'Stiffer',downLabel:'Softer',
 does:'A central heave element that resists both wheels compressing together (pure vertical / aero load) without affecting roll. Prototypes use it to hold the aero platform under high downforce while keeping the corner springs soft for mechanical grip. The corner springs and the 3rd spring are set independently. The 3rd is not L/R linked.',
 up:{bal:0,fx:[
  'Holds ride height better under aero load at speed, more consistent downforce',
  'Less dive/squat from pure vertical loads (braking, crests) without stiffening roll',
  'Too stiff and the platform stops absorbing big vertical hits, skittish over crests'],
  comp:[
   {id:'springF',a:'You can often keep the corner springs softer for mechanical grip, letting the 3rd hold the platform'},
   {id:'bumpstops',a:'3rd spring and packers both manage end-of-travel, set them together'}]},
 down:{bal:0,fx:[
  'More compliant over big vertical inputs. Better mechanical grip on bumps and crests',
  'Platform moves more at speed: aero height varies more through a fast corner',
  'May reach the packers/bumpstops sooner under heavy aero load'],
  comp:[
   {id:'rideHeightF',a:'Check the car isn\'t dropping onto its bumpstops at speed with a softer heave'}]},
 knock:[
  {id:'springF',why:'Corner springs handle roll + heave together; the 3rd spring handles heave only. They overlap on vertical loads'},
  {id:'bumpstops',why:'Both manage how the platform behaves at the end of vertical travel'},
  {id:'rideHeightF',why:'Heave stiffness changes how low the car runs dynamically at speed'}],
 note:'GT3s generally have no active 3rd spring (it reads N/A); it\'s primarily a prototype tool. The Engineer tab shows it only when the car has one.'}
];

/* ──────────────────────── symptoms ──────────────────────── */
const S = [
/* Corner entry */
{id:'entryUnder',group:'Corner entry',name:'Won\'t turn in (entry understeer)',
 desc:'You brake, turn, and the nose washes wide before the apex. Worst while you\'re still on the brakes.',
 quick:'Cheapest test first: move brake bias 0.5% rearward from the wheel. If it improves, the problem is your entry tools, not outright front grip.',
 causes:[
  {id:'brakeBias',label:'Bias too far forward',fix:'Move rearward in 0.5% steps. Frees the car to rotate under trail-braking'},
  {id:'diffPreload',label:'Diff preload too high',fix:'Lower it. A locked diff resists rotation off-throttle'},
  {id:'dampers',label:'Front slow bump too stiff',fix:'Soften so the nose can dive and load the fronts on turn-in'},
  {id:'arbF',label:'Front bar too stiff',fix:'Soften a click. This helps mid-corner too'},
  {id:'pressure',label:'Fronts out of the window',fix:'Check hot pressures before touching anything mechanical'}]},

{id:'entrySnap',group:'Corner entry',name:'Rear snaps under trail-braking',
 desc:'The rear steps out as you brake and turn in together, the classic spin-at-corner-entry.',

// Setup Ripple LMU, .svm parser (stage 1)
// Parses rFactor2/LMU setup files: INI-style, sections with KeySetting=int//display

function parseSVM(text){
  const lines = text.split(/\r?\n/);
  const result = {
    raw: text,
    eol: text.includes('\r\n') ? '\r\n' : '\n',
    vehicleClass: null,
    className: null,      // normalised: Hypercar / LMP2 / LMP3 / GT3
    car: null,
    sections: {},         // section -> [ {key, value(int), display, adjustable, lineIndex} ]
    lineMap: lines,
    settingIndex: {}      // "SECTION.Key" -> lineIndex for fast lookup
  };
  let cur = '__top__';
  result.sections[cur] = [];
  const NON_ADJ = /^(Non-adjustable|Fixed|N\/A|Detached|Standard)$/i;

  lines.forEach((line, i) => {
    const sec = line.match(/^\[([A-Z0-9]+)\]/);
    if(sec){ cur = sec[1]; result.sections[cur] = result.sections[cur]||[]; return; }
    // VehicleClassSetting="ELMS2025 GT3 Porsche_911_GT3_R_LMGT3"
    const vc = line.match(/^VehicleClassSetting="([^"]*)"/);
    if(vc){
      result.vehicleClass = vc[1];
      const s = vc[1];
      if(/Hypercar/i.test(s)) result.className='Hypercar';
      else if(/LMP2/i.test(s)) result.className='LMP2';
      else if(/LMP3/i.test(s)) result.className='LMP3';
      else if(/GT3/i.test(s)) result.className='GT3';
      // car name: strip the class keyword and the season/series token; what's left is the car.
      // Handles all token orders, "AstonMartin_Valkyrie Hypercar WEC2025", "ELMS2025 GT3 Porsche_...", etc.
      const tokens = s.trim().split(/\s+/);
      const isSeason = t => /^(WEC|ELMS|IMSA|WEG|LMDh)\d{2,4}$/i.test(t) || /^\d{4}$/.test(t);
      const isClass  = t => /^(Hypercar|LMP2(_\w+)?|LMP3(_\w+)?|LMGT3|GT3)$/i.test(t);
      result.car = tokens.filter(t => !isSeason(t) && !isClass(t)).join(' ') || tokens[tokens.length-1];
      return;
    }
    // KeySetting=intValue//display    (display optional)
    const m = line.match(/^([A-Za-z0-9_]+Setting)=([-0-9]+)(\/\/(.*))?$/);
    if(m){
      const key = m[1], val = parseInt(m[2],10);
      const display = m[4] !== undefined ? m[4].trim() : '';
      const adjustable = !NON_ADJ.test(display) && display !== '';
      result.sections[cur].push({key, value:val, display, adjustable, lineIndex:i, section:cur});
      result.settingIndex[cur+'.'+key] = i;
    }
  });
  return result;
}

// Write back: step a setting's integer by delta, return new text (lossless except changed line)
function setSettingValue(parsed, section, key, newInt, newLabel){
  const idx = parsed.settingIndex[section+'.'+key];
  if(idx===undefined) throw new Error('No such setting: '+section+'.'+key);
  const line = parsed.lineMap[idx];
  // replace the integer; the game recomputes the label on load, but until then we write an
  // honest marker so the app (and anyone diffing the file) can see what changed
  let newLine = line.replace(/^([A-Za-z0-9_]+Setting=)([-0-9]+)/, '$1'+newInt);
  if(newLabel!==undefined && newLine.indexOf('//')>=0) newLine = newLine.replace(/\/\/.*$/, '//'+newLabel);
  const out = parsed.lineMap.slice();
  out[idx] = newLine;
  return out.join(parsed.eol);
}

// Diff two parsed setups: return changed settings (by section.key)
function diffSetups(a, b){
  const changes = [];
  for(const key in a.settingIndex){
    const ia = a.settingIndex[key], ib = b.settingIndex[key];
    if(ib===undefined) continue;
    const la = a.lineMap[ia], lb = b.lineMap[ib];
    const va = la.match(/=([-0-9]+)/), vb = lb.match(/=([-0-9]+)/);
    if(va && vb && va[1]!==vb[1]){
      const da = (la.match(/\/\/(.*)$/)||[])[1]||'';
      const db = (lb.match(/\/\/(.*)$/)||[])[1]||'';
      changes.push({key, fromInt:+va[1], toInt:+vb[1], fromDisplay:da.trim(), toDisplay:db.trim()});
    }
  }
  return changes;
}

         (a.className?`<span>${esc(a.className)}</span>`:'') +
         (h?`<span class="arch">${esc(h.tag)}</span>`:'');
}

function symBalance(name){

const hasFS = !!(window.SetupRippleDir || ('showDirectoryPicker' in window));

function get(obj,path){ return path.split('.').reduce((o,k)=>o&&o[k]!==undefined?o[k]:undefined,obj); }
function tilt(pid,delta){
  if(!pid||!delta) return null;
  const b = delta>0 ? byId[pid].up.bal : byId[pid].down.bal;
  return b>0?'looser':(b<0?'tighter':null);
}
function chip(t){ return t?`<span class="chip ${t==='looser'?'loose':'tight'}">${t}</span>`:''; }
function confChip(c){ return (c==='likely'||c==='guess')?` <span class="chip">${c}</span>`:''; }
function esc(s){ return String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c])); }
function fmt(v){ return typeof v==='number' ? (Number.isInteger(v)?v:+v.toFixed(3)) : v; }

function addSetup(name,label,text,saveDir,origin){
  try{
    const parsed = parseSVM(text);
    parsed.name = name;
    parsed.label = label;
    parsed.saveDir = saveDir;
    parsed.origin = origin;
    setups.push(parsed);
  }catch(e){ console.warn('Could not parse setup', label, e); }
}

/* Re-read the already-chosen folder with no dialog, so newly saved setups appear.
   Replaces only folder-sourced setups, files added via "Add setup files…" are kept.
   Selections are preserved by name where the setup still exists. */
/* Each sim remembers its own last folder, so LMU never opens in your Evo folder and vice versa. */
const DIR_KEY='setupRipple.lastDir.lmu';
function lastDir(){ try{ return localStorage.getItem(DIR_KEY)||undefined; }catch(e){ return undefined; } }
function rememberDir(d){ try{ if(d) localStorage.setItem(DIR_KEY,d); }catch(e){} }
async function addFilesNative(){
  try{
    const files=await window.SetupRippleDir.addFiles(lastDir(), ['svm']);
    if(!files || !files.length) return;
    let added=0;
    for(const f of files){ if(isSvmName(f.name) && f.text!=null){ addSetup(f.name, f.relPath, f.text, f.fullPath, 'files'); added++; } }
    rememberDir(files[0].dir);
    if(selView<0 && setups.length) switchView(setups.length-added);
    buildNav(); renderEng();
  }catch(e){ console.warn('Add files failed:', e); }
}

async function refreshFolder(){
  if(!(window.SetupRippleDir && window.SetupRippleDir.rescan)) return false;
  let files;
  try{ files = await window.SetupRippleDir.rescan(); }
  catch(e){ console.warn('Rescan failed:', e); return false; }
  if(!files) return false;
  const nameOf = i => (i>=0 && setups[i]) ? setups[i].label : null;
  const keepA=nameOf(selA), keepB=nameOf(selB), keepV=nameOf(selView);
  setups = setups.filter(s=>s.origin!=='folder');
  for(const f of files){
    try{
      if(isSvmName(f.name)){
        const text = f.text!=null ? f.text : (f.buffer ? new TextDecoder().decode(new Uint8Array(f.buffer)) : null);
        if(text!=null) addSetup(f.name, f.relPath, text, f.fullPath, 'folder');
      }
    }catch(e){ console.warn('Skipped', f.relPath, e); }
  }
  const find = lbl => lbl==null ? -1 : setups.findIndex(s=>s.label===lbl);
  selA=find(keepA); selB=find(keepB); selView=find(keepV);
  if(selView<0 && setups.length) switchView(0);
  return true;
}

const isSvmName = n => /\.svm$/i.test(n);

async function pickFolder(){
  try{
    if(window.SetupRippleDir){
      const files = await window.SetupRippleDir.pick(lastDir());
      if(window.SetupRippleDir.lastDir) rememberDir(window.SetupRippleDir.lastDir());
      let added=0;
      for(const f of files){
        try{
          if(isSvmName(f.name)){
            // svm is text; bridge gives .text for json-likes, but svm may arrive as buffer, handle both
            const text = f.text!=null ? f.text : (f.buffer ? new TextDecoder().decode(new Uint8Array(f.buffer)) : null);
            if(text!=null){ addSetup(f.name, f.relPath, text, f.fullPath, 'folder'); added++; }
          }
        }catch(e){ console.warn('Skipped', f.relPath, e); }
      }
      if(!added && files.length) console.warn('Folder had '+files.length+' files but no .svm setups loaded.');
    }else{
      const root = await window.showDirectoryPicker();
      async function walk(dh,prefix,depth){
        if(depth>4) return;
        for await(const [nm,h] of dh.entries()){
          if(h.kind==='directory') await walk(h,prefix?prefix+' / '+nm:nm,depth+1);
          else if(isSvmName(nm)){
            const lbl=(prefix?prefix+' / ':'')+nm;
            try{ addSetup(nm,lbl,await (await h.getFile()).text(),dh,'folder'); }catch(e){ console.warn('Skipped',lbl,e); }
          }
        }
      }
      await walk(root,'',0);
    }
    if(selView<0 && setups.length) switchView(0);
    buildNav(); renderEng();
  }catch(e){ if(e && e.name!=='AbortError') console.warn('Folder load failed:', e); }
}

function setupOptions(sel){
  return setups.map((s,i)=>`<option value="${i}" ${i===sel?'selected':''}>${esc(s.label)}${s.className?' · '+s.className:''}</option>`).join('');
}

// Build the value lookup for a parsed setup: "SECTION.Key" -> {value, display, adjustable}
function svmField(parsed, section, key){
  const idx = parsed.settingIndex[section+'.'+key];
  if(idx===undefined) return null;
  const line = parsed.lineMap[idx];
  const v = line.match(/=([-0-9]+)/);
  const d = (line.match(/\/\/(.*)$/)||[])[1];
  const display = d!==undefined ? d.trim() : '';
  const NON_ADJ = /^(Non-adjustable|Fixed|N\/A|Detached|Standard)$/i;
  let adjustable = !NON_ADJ.test(display) && display!=='';
  // "Detached" is click 0 on an anti-roll bar: a real position you can move back up from.
  if(!adjustable && /AntiSwaySetting$/.test(key) && /^Detached$/i.test(display)) adjustable=true;
  // Cars store settings they don't have as "0//0%", which reads as adjustable. Front diff only
  // exists on front-hybrid LMH cars; regen and deploy only on hybrids.
  if(adjustable && /^FrontDiff/.test(key) && !hasFrontDrive(parsed)) adjustable=false;
  if(adjustable && /^(RegenerationMapSetting|ElectricMotorMapSetting)$/.test(key) && !isHybridCar(parsed)) adjustable=false;
  return { value:+v[1], display, adjustable };
}
function hasFrontDrive(parsed){
  if(parsed.className!=='Hypercar') return false;
  const h = (typeof hyperArch==='function') ? hyperArch(parsed.car, parsed.className) : null;
  return h ? /front/i.test(h.tag) : true;   // unrecognised Hypercar: trust the file
}

/* ── Edited-label marker ──
   .svm lines are "Key=N//label". The game reads N and rewrites the label itself on load,
   so after we change N the old label is stale. We rewrite edited labels as
   "D22 S-H (edited, 1 click up)" using only characters the game's own labels already use.
   A later edit reads the marker and combines, so markers never stack; a net of zero
   restores the original label. */
const EDIT_MARK = /^(.*?) \(edited, (\d+) clicks? (up|down)\)$/;
function parseMarkedLabel(display){
  const m = String(display||'').match(EDIT_MARK);
  if(!m) return {base:String(display||''), delta:0};
  return {base:m[1], delta:(m[3]==='up'?1:-1)*parseInt(m[2],10)};
}
function clickPhrase(n){ const a=Math.abs(n); return a+' click'+(a===1?'':'s')+' '+(n>0?'up':'down'); }
function makeMarkedLabel(base, delta){
  return delta===0 ? base : base+' (edited, '+clickPhrase(delta)+')';
}

// Render one field row (label + value), greyed if non-adjustable / missing
// Render nudge controls (◄ ►) + pending-step badge for an adjustable field.
// linked=true mirrors L/R. Buttons carry data attrs wired in renderEng.
function nudgeCtl(section, key, label, linked){
  const e = editFor(section,key), pend = e ? e.steps : 0;
  const f = selView>=0 ? svmField(setups[selView],section,key) : null;
  const atFloor = (e ? e.final : (f?f.value:1)) <= 0;
  const badge = `<span class="eng-pend">${pend!==0?(pend>0?'+':'')+pend:''}</span>`;
  const lk = linked?'1':'0';
  return `<span class="eng-nudge">${badge}`+
    `<button class="nbtn" data-sec="${section}" data-key="${key}" data-lbl="${esc(label)}" data-d="-1" data-lk="${lk}" ${atFloor?'disabled title="Already at the first position"':'title="One click down"'}>◄</button>`+
    `<button class="nbtn" data-sec="${section}" data-key="${key}" data-lbl="${esc(label)}" data-d="1" data-lk="${lk}" title="One click up">►</button></span>`;
}

function fieldRow(parsed, section, key, label){
  const f = svmField(parsed, section, key);
  if(!f) return ''; // field doesn't exist for this car/class, skip entirely
  const cls = f.adjustable ? 'eng-row' : 'eng-row na';
  const val = f.display!=='' ? f.display : ', ';
  const ctl = f.adjustable ? nudgeCtl(section, key, label, false) : '';
  return `<div class="${cls}"><span class="eng-k">${esc(label)}</span><span class="eng-cell"><span class="eng-v">${esc(val)}</span>${ctl}</span></div>`;
}

// For L/R linked groups, the FRONTLEFT/REARLEFT key drives display; we show one value (linked) + 3rd spring if present
// 3rd-spring (heave) fields live in [SUSPENSION] as Front3rd*/Rear3rd* keys.
function thirdKeyFor(leftSection, key){
  const side = leftSection.indexOf('FRONT')===0 ? 'Front' : (leftSection.indexOf('REAR')===0 ? 'Rear' : null);
  if(!side) return null;
  const map = {
    SpringSetting:'3rdSpringSetting', PackerSetting:'3rdPackerSetting',
    SlowBumpSetting:'3rdSlowBumpSetting', SlowReboundSetting:'3rdSlowReboundSetting',
    FastBumpSetting:'3rdFastBumpSetting', FastReboundSetting:'3rdFastReboundSetting',
  };
  if(!map[key]) return null;
  return ['SUSPENSION', side+map[key]];
}

function lrFieldRow(parsed, leftSection, key, label, third){
  const f = svmField(parsed, leftSection, key);
  if(!f) return '';
  const cls = f.adjustable ? 'eng-row' : 'eng-row na';
  const val = f.display!=='' ? f.display : ', ';
  const ctl = f.adjustable ? nudgeCtl(leftSection, key, label, true) : '';
  let thirdCell = '';
  if(third){
    const tk = thirdKeyFor(leftSection, key);
    if(tk){
      const t = svmField(parsed, tk[0], tk[1]);
      if(t && t.display!=='' && !/^(Non-adjustable|Detached|N\/A)$/i.test(t.display)){
        const tctl = t.adjustable ? nudgeCtl(tk[0], tk[1], label+' (3rd)', false) : '';
        thirdCell = `<span class="eng-cell eng-3rd" title="3rd spring / heave element"><span class="eng-v3">3rd: ${esc(t.display)}</span>${tctl}</span>`;
      }
    }
  }
  return `<div class="${cls}"><span class="eng-k">${esc(label)}</span><span class="eng-cell"><span class="eng-v">${esc(val)}</span>${ctl}</span>${thirdCell}</div>`;
}

function renderEngGroup(parsed, g){
  const rows = g.fields.map(([sec,key,lbl])=>{
    if(g.lr) return lrFieldRow(parsed, sec, key, lbl, g.third);
    return fieldRow(parsed, sec, key, lbl);
  }).join('');
  if(!rows.trim()) return ''; // whole group empty for this car
  return `<div class="eng-group"><h4>${esc(g.title)}${g.lr?' <span class="eng-lr">L/R linked</span>':''}</h4>${rows}</div>`;
}

function renderEngPage(parsed, pageId){
  const page = LMU_PAGES.find(p=>p.id===pageId) || LMU_PAGES[0];
  const groups = page.groups.map(g=>renderEngGroup(parsed,g)).join('');
  return `<div class="eng-page">${groups||'<p class="eng-empty">No adjustable settings on this page for this car.</p>'}</div>`;
}

/* ──────────────── stage 3: driver-request fixes (manual + presets) ──────────────── */
// Pending edits are stored as integer deltas against the loaded setup, keyed "SECTION.Key".
// We never predict the displayed value (per-car step sizes make it unpredictable), we step
// the integer and let the game show the exact value on load. The UI shows direction + click count.

let pendingEdits = {};          // manual nudges only: "SECTION.Key" -> { steps, label, section, key, mirror }
let selPresets = [];            // driver requests picked (click again to drop)
let excludedEdits = new Set();  // settings removed from the pending list with the x button
let lastSaveMsg='';   // survives the pending list clearing after a save
const pendingStore = new Map(); // setup label -> staged changes, kept while you look at another setup
let curEdits = [];              // computed changes for the setup on screen (rebuilt every render)

function isArbKey(k){ return /AntiSwaySetting$/.test(k); }
// Setting names for lists: L/R fields and labels shared by two different settings (front and rear
// anti-roll bar, toe-in) carry their group, e.g. "Front Chassis: Anti-roll bar".
const FIELD_LABELS = (()=>{ const m={}, owners={};
  LMU_PAGES.forEach(pg=>pg.groups.forEach(g=>g.fields.forEach(([sec,key,lbl])=>{ (owners[lbl]=owners[lbl]||new Set()).add(sec+'.'+key); })));
  LMU_PAGES.forEach(pg=>pg.groups.forEach(g=>g.fields.forEach(([sec,key,lbl])=>{
    const id=sec+'.'+key; if(m[id]) return;
    const nm = (g.lr || owners[lbl].size>1) ? (g.title+': '+lbl) : lbl;
    m[id]=nm; if(/LEFT$/.test(sec)) m[sec.replace(/LEFT$/,'RIGHT')+'.'+key]=nm; })));
  return m; })();
function fieldName(section,key){ return FIELD_LABELS[section+'.'+key] || key.replace(/Setting$/,''); }

/* Everything staged for one setup, worked out fresh each time: your nudges plus the requests you've
   picked, per setting. Requests that touch a left corner also change the right, the same way the
   in-game link and the manual nudges do. Nothing goes below click 0, and a request never takes an
   anti-roll bar all the way to Detached on its own. */
function computeEdits(parsed){
  if(!parsed) return [];
  const m=new Map();
  const add=(section,key,delta,src,why,mirror)=>{
    const id=section+'.'+key; if(excludedEdits.has(id)) return;
    const f=svmField(parsed,section,key); if(!f||!f.adjustable) return;
    let e=m.get(id);
    if(!e){ e={id,section,key,name:fieldName(section,key),manual:0,preset:0,why:[],base:f.value,display:f.display,mirror:!!mirror}; m.set(id,e); }
    e[src]+=delta; if(why && !e.why.includes(why)) e.why.push(why);
  };
  for(const e of Object.values(pendingEdits)) add(e.section,e.key,e.steps,'manual','Your nudge',e.mirror);
  for(const pid of selPresets){
    const fix=PRESET_FIXES.find(x=>x.id===pid); if(!fix) continue;
    fix.nudges.forEach(n=>{
      const d = typeof n.deltaFn==='function' ? n.deltaFn(parsed) : n.delta; if(!d) return;
      add(n.section,n.key,d,'preset',n.label,false);
      if(/LEFT$/.test(n.section)) add(n.section.replace(/LEFT$/,'RIGHT'),n.key,d,'preset',n.label,true);
    });
  }
  const out=[];
  for(const e of m.values()){
    let fin=e.base+e.manual+e.preset;
    if(isArbKey(e.key) && e.preset<0 && e.base+e.manual>=1 && fin<1){ fin=1; e.held=true; }
    if(fin<0){ fin=0; e.atMin=true; }
    e.final=fin; e.steps=fin-e.base;
    if(e.steps!==0 || e.atMin || e.held) out.push(e);
  }
  return out;
}
function editFor(section,key){ return curEdits.find(e=>e.section===section && e.key===key); }
function pendingCount(){ return curEdits.filter(e=>!e.mirror && e.steps!==0).length; }
function hasStaged(){ return Object.keys(pendingEdits).length>0 || selPresets.length>0 || excludedEdits.size>0; }

// Staged changes belong to one setup. Switching away sets them aside; switching back brings them back.
function switchView(i){
  const cur=setups[selView];
  if(cur){ if(hasStaged()) pendingStore.set(cur.label,{pendingEdits,selPresets,excludedEdits}); else pendingStore.delete(cur.label); }
  selView=i;
  const nxt=setups[selView], st=nxt&&pendingStore.get(nxt.label);
  pendingEdits=st?st.pendingEdits:{}; selPresets=st?st.selPresets:[]; excludedEdits=st?st.excludedEdits:new Set();
  if(nxt) pendingStore.delete(nxt.label);
}
function resetStaged(){ pendingEdits={}; selPresets=[]; excludedEdits=new Set(); }

// Manual nudge by one click. Left corner fields also move the right, as the game links them.
function nudge(section, key, label, delta, linked){
  lastSaveMsg='';
  const bump=(sec,mirror)=>{ const id=sec+'.'+key; excludedEdits.delete(id);
    const cur = pendingEdits[id] ? pendingEdits[id].steps : 0, steps=cur+delta;
    if(steps===0) delete pendingEdits[id]; else pendingEdits[id]={steps,label,section:sec,key,mirror}; };
  bump(section,false);
  if(linked && /LEFT$/.test(section)) bump(section.replace(/LEFT$/,'RIGHT'),true);
  renderEng();
}
function togglePreset(id){ lastSaveMsg=''; const i=selPresets.indexOf(id); if(i>=0) selPresets.splice(i,1); else selPresets.push(id); renderEng(); }
function removeEdit(id){
  lastSaveMsg='';
  const ids=[id]; if(/LEFT\./.test(id)) ids.push(id.replace('LEFT.','RIGHT.'));
  ids.forEach(x=>{ delete pendingEdits[x]; excludedEdits.add(x); });

}

// Apply all pending edits to the parsed setup, return new .svm text
function buildEditedSVM(parsed){
  let text = parsed.raw;
  let p = parseSVM(text);
  for(const e of computeEdits(parsed)){
    if(e.steps===0) continue;
    const id=e.section+'.'+e.key, idx=p.settingIndex[id];
    if(idx===undefined) continue;
    const line=p.lineMap[idx];
    const cur=parseMarkedLabel((line.match(/\/\/(.*)$/)||[])[1]);
    // click 0 on a bar is the one label we know for certain; otherwise say what changed. A bar coming
    // back up from Detached has no known label, so call it Connected rather than repeat "Detached".
    const base = /^Detached$/i.test(cur.base.trim()) ? 'Connected' : cur.base.trim();
    const label = (isArbKey(e.key) && e.final===0) ? 'Detached' : makeMarkedLabel(base, cur.delta + e.steps);
    text = setSettingValue(p, e.section, e.key, e.final, label);
    p = parseSVM(text);
  }
  return text;
}

function downloadSVM(text, filename){
  const blob = new Blob([text], {type:'application/octet-stream'});
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href = url; a.download = filename;
  document.body.appendChild(a); a.click();
  setTimeout(()=>{ document.body.removeChild(a); URL.revokeObjectURL(url); }, 100);
}

function saveEdited(){
  const a = selView>=0 ? setups[selView] : null;

  const base = (a.name||'setup').replace(/\.svm$/i,'').replace(/_SR\d*$/i,'');
  const dirOf = l => { const i=String(l||'').lastIndexOf(' / '); return i<0?'':String(l).slice(0,i); };
  const here = dirOf(a.label);
  const taken = new Set(setups.filter(x=>dirOf(x.label)===here).map(x=>String(x.name||'').toLowerCase()));

// ── Preset problems: handling complaint -> setting nudges ──
// Each fix nudges integer steps. Direction respects front/rear axle effect.
// Only applies fixes whose target fields are ADJUSTABLE in the loaded car (checked at render).
/* One click of brake pressure is worth a different amount on each car (about 1% on a Hypercar,
   nearly 7% on an LMP3). The label carries the percentage and pressure runs linearly from zero on
   every car checked, so work out how many clicks make roughly 5% here. On a file we've already
   edited the label still holds the original percentage, so use the original click position. */
function brakePressureClicks5(parsed){
  const f=svmField(parsed,'CONTROLS','BrakePressureSetting');
  if(!f || !f.adjustable || f.value<=0) return 0;
  const L=parseMarkedLabel(f.display), m=L.base.match(/\((\d+(?:\.\d+)?)%\)/);
  const origIdx=f.value-L.delta;
  if(!m || origIdx<=0) return -1;
  const pctPerClick=parseFloat(m[1])/origIdx;
  return -Math.min(f.value, Math.max(1, Math.round(5/pctPerClick)));
}

  ['hybrid','Hybrid','Hypercar energy systems']];
function groupedFixes(items, card){
  const known=new Set(REQ_GROUPS.map(g=>g[0]));
  const out=REQ_GROUPS.map(([g,t,sub])=>{ const its=items.filter(x=>x.group===g); if(!its.length) return '';

  const rest=items.filter(x=>!known.has(x.group));
  return out + (rest.length?`<div class="fix-grid">${rest.map(card).join('')}</div>`:'');
}

// Which preset fixes are applicable (have at least one adjustable target) for this car
/* Hybrid-only presets. The file alone can't tell us: non-hybrid cars store regen as "0//0%",
   which reads as adjustable. So gate on class + architecture instead. An unrecognised
   Hypercar still gets them, since almost every Hypercar is a hybrid. */
const HYBRID_PRESETS = new Set(['hybrid_brake','energy_short']);
function isHybridCar(parsed){
  if(parsed.className!=='Hypercar') return false;
  const h = (typeof hyperArch==='function') ? hyperArch(parsed.car, parsed.className) : null;
  return !(h && /non-hybrid/i.test(h.tag));
}
function applicablePresets(parsed){
  return PRESET_FIXES.filter(fix=>{
    if(HYBRID_PRESETS.has(fix.id) && !isHybridCar(parsed)) return false;
    if(fix.noAbs && parsed.className==='GT3') return false;   // LMGT3 has ABS
    return fix.nudges.some(n=>{ const f=svmField(parsed,n.section,n.key); return f && f.adjustable; });
  });
}

/* Hypercar architecture. A fixed property of each car, so a lookup is more reliable than
   any file-based detection. Three groups matter for setup:
     LMDh        spec hybrid, rear axle only
     LMH hybrid  manufacturer hybrid on the FRONT axle (effectively AWD under deploy)
     LMH non-hybrid  no energy system at all. Regen/deploy content is irrelevant
   Matched on distinctive substrings so it survives season prefixes and naming quirks.
   Cars not listed get no badge rather than a guess. */
function hyperArch(car, className){
  if(className!=='Hypercar' || !car) return null;
  const c=String(car).toLowerCase();
  const t=(re)=>re.test(c);
  if(t(/963|m_?hybrid|v-?series|gmr-?001|genesis|sc63|lamborghini|cadillac|bmw/)) return {
    tag:'LMDh', label:'LMDh. Spec hybrid, rear axle',
    note:'The hybrid system is a standard unit driving the rear axle only. Regen adds rear braking effort, so it interacts with brake bias and migration; there is no front-axle deploy.'};
  if(t(/499p|ferrari|gr010|tr010|toyota|9x8|peugeot|isotta|tipo/)) return {
    tag:'LMH · front hybrid', label:'LMH, front-axle hybrid',
    note:'A manufacturer hybrid on the front axle: under deploy the car is effectively four-wheel drive, and the front differential setting is live. Regen through the front changes how the nose behaves under braking.'};
  if(t(/valkyrie|aston|glickenhaus|scg|vandervell|vanwall/)) return {
    tag:'LMH · non-hybrid', label:'LMH, no hybrid',
    note:'No energy system at all. Regen, motor map and virtual-energy settings do not apply. Braking is purely mechanical, which usually means a lower brake pressure and more attention to bias.'};
  return null;
}

function onFilePick(e){
  const files=[...e.target.files];
  let pending=files.length;
  if(!pending) return;
  files.forEach(file=>{
    const r=new FileReader();
    r.onload=()=>{ if(isSvmName(file.name)) addSetup(file.name, file.name, r.result, null); if(--pending===0){ if(selView<0&&setups.length) switchView(0); buildNav(); renderEng(); } };
    r.onerror=()=>{ if(--pending===0){ buildNav(); renderEng(); } };
    r.readAsText(file);
  });
}

// Compare two parsed setups: show changed settings, mapped to friendly labels via the page map
// Handling-effect knowledge: for a given setting key, what does INCREASING the value tend to do
// to the car's balance? 'tight' = more stable / understeer-biased, 'loose' = more rotation / oversteer-biased.
// Direction is the general setup-theory tendency; the app labels the change, the driver judges feel.
// front-axle changes and rear-axle changes push balance opposite ways, encoded per key.
const HANDLING = {
  // springs / ARB: stiffer front -> looser (less front grip); stiffer rear -> tighter
  'SUSPENSION.FrontAntiSwaySetting':{up:'loose',label:'front ARB'},
  'SUSPENSION.RearAntiSwaySetting':{up:'tight',label:'rear ARB'},
  // wings: more rear wing -> tighter (rear grip); more front wing -> looser
  'REARWING.RWSetting':{up:'tight',label:'rear wing'},
  'FRONTWING.FWSetting':{up:'loose',label:'front wing'},
  // toe: more front toe-in -> tighter entry; more rear toe-in -> tighter overall
  'SUSPENSION.FrontToeInSetting':{up:'tight',label:'front toe'},
  'SUSPENSION.RearToeInSetting':{up:'tight',label:'rear toe'},
  // brake bias: more rearward -> looser on entry (RearBrakeSetting raises rear %)
  'CONTROLS.RearBrakeSetting':{up:'loose',label:'brake bias rear'},
  // diff: more power-side locking -> looser on power; more preload -> tighter mid
  'DRIVELINE.DiffPowerSetting':{up:'loose',label:'power-side lock'},
  'DRIVELINE.DiffCoastSetting':{up:'tight',label:'coast-side lock'},
};

function effectLabel(key, fromInt, toInt){
  const h = HANDLING[key];
  if(!h) return '';
  const dir = toInt>fromInt ? h.up : (h.up==='tight'?'loose':'tight');
  return dir; // 'tight' | 'loose'
}

function compareText(){
  const a=setups[selA], b=setups[selB]; if(!a||!b||a===b) return '';
  const lines=diffSetups(a,b).map(c=>{ let lbl=c.key; for(const pg of LMU_PAGES) for(const g of pg.groups) for(const [s1,k1,l1] of g.fields) if(s1+'.'+k1===c.key && lbl===c.key) lbl=pg.name+' > '+fieldName(s1,k1);
    const A=parseMarkedLabel(c.fromDisplay).base, B=parseMarkedLabel(c.toDisplay).base;
    return '- '+lbl+': '+A+' -> '+(A===B?'(shows in-game)':B)+' ['+clickPhrase(c.toInt-c.fromInt)+']'; });
  return 'A: '+a.name+'\nB: '+b.name+'\n'+lines.join('\n');
}
function renderCompare(a,b){
  const labelFor = (sectionKey)=>{
    const [sec,key]=sectionKey.split('.');
    for(const pg of LMU_PAGES) for(const g of pg.groups) for(const [s,k,l] of g.fields)
      if(s===sec && k===key) return {page:pg.name, label:fieldName(sec,key)};
    return {page:'', label:sectionKey};
  };
  const changes = diffSetups(a,b).map(c=>{ const m=labelFor(c.key); return {...c, ...m}; })
    .filter(c=>c.label);
  // Same warning as the Kunos app: values from different cars aren't directly comparable.
  const WARN_SVG='<svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 3 2.5 20h19L12 3z"/><path d="M12 9v5M12 17.5v.5"/></svg>';
  const diffCar = a.car && b.car && (a.car!==b.car || a.className!==b.className);
  const warn = diffCar ? `<p class="warn">${WARN_SVG}<span>Different cars. Values aren't directly comparable between cars, so read this as direction only.</span></p>` : '';
  if(!changes.length) return warn+'<p class="eng-empty">No differences. These two setups are identical in every adjustable field.</p>';
  let anyStale = false;
  const rows = changes.map(c=>{
    const eff = effectLabel(c.key, c.fromInt, c.toInt);
    const chip = eff ? `<span class="chip ${eff}">${eff==='tight'?'tighter':'looser'}</span>` : '';
    const A = parseMarkedLabel(c.fromDisplay), B = parseMarkedLabel(c.toDisplay);
    let aTxt = A.base || String(c.fromInt), bTxt = B.base || String(c.toInt);
    // Same game label on both sides but a different number: the label is stale (edited outside
    // the game), so the value only shows once the game loads it. The change column is exact.
    if(A.base && A.base===B.base){ anyStale = true; bTxt = 'shows in-game'; }
    return `<tr><td>${esc(c.page)}</td><td>${esc(c.label)}</td><td class="cmp-a">${esc(aTxt)}</td><td class="cmp-b">${esc(bTxt)}</td><td>${esc(clickPhrase(c.toInt - c.fromInt))}</td><td>${chip}</td></tr>`;
  }).join('');
  return `${warn}<table class="cmp-table"><thead><tr><th>Page</th><th>Setting</th><th>A</th><th>B</th><th>Change</th><th>Effect</th></tr></thead><tbody>${rows}</tbody></table>
  <p class="eng-note">"Tighter/looser" shows the general setup-theory tendency of the change toward stability (tighter) or rotation (looser), where known. Tyres, fuel and track change the feel. Treat it as a pointer, not a promise.</p>
  ${anyStale?`<p class="eng-note">"Shows in-game" means that setup was edited outside the game. The change is real; the game shows the exact value when you load it.</p>`:''}
  <div class="eng-actions"><button class="btn" id="btnCopyCmp">Copy comparison</button></div>`;
}

function parseLapTime(s){
  if(!s) return null;
  s=String(s).trim();
  if(s.includes(':')){
    const [m,sec]=s.split(':');
    const mm=parseFloat(m), ss=parseFloat(sec);
    if(isNaN(mm)||isNaN(ss)) return null;
    return mm*60+ss;
  }
  const v=parseFloat(s);
  return isNaN(v)?null:v;
}

function renderFuelOut(){
  const out=document.getElementById('fuelOut');
  if(!out) return;
  const perLap=fuel.perLap;
  let laps;
  if(fuel.unit==='laps'){
    laps=Math.ceil(fuel.length);
  }else{
    const lt=parseLapTime(fuel.lapTime);
    if(!lt||lt<=0){
      out.innerHTML=`<p class="fuel-warn">Enter a valid lap time (e.g. 1:45) to convert ${fuel.length} minutes into laps.</p>`;
      return;
    }
    laps=Math.ceil((fuel.length*60)/lt);
  }
  const formationLaps=fuel.formation?1:0;
  const totalLaps=laps+formationLaps+fuel.margin;
  const litres=perLap*totalLaps;
  const need=Math.ceil(litres);
  if(perLap<=0||totalLaps<=0){
    out.innerHTML=`<p class="fuel-warn">Enter fuel per lap and race length to calculate.</p>`;
    return;
  }
  out.innerHTML=`
    <div class="big">${need}<span> L</span></div>
    <div class="line"><span>Racing laps</span><b>${laps}</b></div>
    ${formationLaps?`<div class="line"><span>Formation lap</span><b>+${formationLaps}</b></div>`:''}
    ${fuel.margin?`<div class="line"><span>Safety margin</span><b>+${fuel.margin} lap${fuel.margin===1?'':'s'}</b></div>`:''}
    <div class="line"><span>Total laps fuelled</span><b>${totalLaps}</b></div>
    <div class="line"><span>Exact need</span><b>${litres.toFixed(1)} L</b></div>
    <p class="fuel-warn">Rounded up to ${need} L. Carrying spare fuel adds weight. Trim the margin for quali or sprints.</p>`;
}

/* ─────────────────────── Bono AI ───────────────────────
   Bridge contract (provided by Electron preload, window.SetupRippleAI):
   • available() -> Promise<{ok:true} | {ok:false, reason:string}>
       (also tolerated: a plain boolean, or a non-Promise value)
   • send(prompt, { allowWrite, onChunk, onDone, onError })
       streaming callback model:
         onChunk(text)   – called repeatedly as output streams
         onDone(fullText)– called once on clean completion
         onError(message)– called on failure
       allowWrite (bool, default false) – when false the bridge prepends
         a read-only instruction so Bono never edits files without approval.
       (also tolerated: send() returning Promise<fullText> instead of streaming)
   The folder-picker bridge is window.SetupRippleDir.pick(), NOT
   showDirectoryPicker, which is a reserved browser name contextBridge
   refuses to bind over (that collision blocked SetupRippleAI entirely).
──────────────────────────────────────────────────────── */
function AI(){ return window.SetupRippleAI || null; }

/* ---- Bono setup picker: derive car / track / setup from loaded setups ----
   Setup labels look like "GT3 / Audi / audi_spa.carsetup" (folder relPath) or
   just a filename. We split on " / ". Last part is the setup, the part before
   it the track, and anything earlier joined as the car/category path. This is
   purely a naming aid: it inserts a clear reference into the message so both
   you and Bono know exactly which setup you mean. Bono reads the files itself. */
function spParts(label){
  const segs=String(label).split(' / ').map(s=>s.trim()).filter(Boolean);
  const setup=segs.length?segs[segs.length-1]:label;
  const track=segs.length>=2?segs[segs.length-2]:'';
  const car  =segs.length>=3?segs.slice(0,segs.length-2).join(' / '):'';
  return {car,track,setup};
}
function spCars(){
  return [...new Set(aiSetups.map(s=>s.car).filter(Boolean))].sort();
}
function spTracks(car){
  return [...new Set(aiSetups.filter(s=>s.car===car).map(s=>s.track).filter(Boolean))].sort();
}
function spSetups(car,track){
  return aiSetups.filter(s=>s.car===car&&s.track===track)
    .map(s=>s.setup).sort();
}
function spReference(){
  const bits=[];
  if(spCar) bits.push(spCar);
  if(spTrack) bits.push(spTrack);
  if(spSetup) bits.push(spSetup);
  return bits.join(' / ');
}
// Bono loads its own setup name list. Independent of the Engineer tab.
// Reuses the same bridge. Parses each file's car/class from its contents (like the
// Engineer tab does) rather than guessing from folder depth. LMU folders are usually
// just <track>/<file>.svm, so path-based car detection found nothing.
async function aiPickFolder(){
  try{
    if(window.SetupRippleDir){
      const files = await window.SetupRippleDir.pick();
      aiSetups = files.map(f=>{
        const segs = String(f.relPath||f.name||'').split(' / ').map(s=>s.trim()).filter(Boolean);
        const setup = segs.length?segs[segs.length-1]:(f.name||'');
        const track = segs.length>=2?segs[segs.length-2]:'';
        let car='';
        try{
          if(f.text!=null){
            const p=parseSVM(f.text);
            car = (p.car||'') + (p.className?(p.car?' ':'')+'('+p.className+')':'');
            if(!car) car = p.className||'';
          }
        }catch(e){}
        return { car:car||'Unknown car', track, setup, relPath:f.relPath||f.name };
      }).filter(s=>s.setup).sort((a,b)=>a.setup.localeCompare(b.setup));
    }else if(window.showDirectoryPicker){
      const root=await window.showDirectoryPicker();
      const list=[];
      async function walk(dh,prefix,depth){
        if(depth>4) return;
        for await(const [name,h] of dh.entries()){
          if(h.kind==='directory') await walk(h,prefix?prefix+' / '+name:name,depth+1);
          else if(/\.(carsetup|setup|json|svm)$/i.test(name)){
            const relPath=(prefix?prefix+' / ':'')+name;
            const segs=relPath.split(' / ').map(s=>s.trim()).filter(Boolean);
            const track=segs.length>=2?segs[segs.length-2]:'';
            let car='';
            try{ const file=await h.getFile(); const text=await file.text();
              const p=parseSVM(text); car=(p.car||'')+(p.className?(p.car?' ':'')+'('+p.className+')':''); if(!car) car=p.className||'';
            }catch(e){}
            list.push({ car:car||'Unknown car', track, setup:name, relPath });
          }
        }
      }
      await walk(root,'',0);
      aiSetups=list.sort((a,b)=>a.setup.localeCompare(b.setup));
    }
    spCar=''; spTrack=''; spSetup='';
    if(mode==='ai') renderAI();
  }catch(e){
    if(e && e.name!=='AbortError') console.warn('Bono folder load failed:', e);
  }
}

  main.querySelectorAll('[data-ex]').forEach(b=>b.onclick=()=>aiSendMsg(b.dataset.ex));
  // setup picker wiring (Bono-independent)
  const spOpen=document.getElementById('spOpen'); if(spOpen) spOpen.onclick=aiPickFolder;
  const spReload=document.getElementById('spReload'); if(spReload) spReload.onclick=aiPickFolder;
  const cSel=document.getElementById('spCar');
  const tSel=document.getElementById('spTrack');
  const sSel=document.getElementById('spSetup');
  if(cSel) cSel.onchange=()=>{ spCar=cSel.value; spTrack=''; spSetup=''; renderAI(); };
  if(tSel) tSel.onchange=()=>{ spTrack=tSel.value; spSetup=''; renderAI(); };
  if(sSel) sSel.onchange=()=>{ spSetup=sSel.value; renderAI(); };
  const ins=document.getElementById('spInsert');
  if(ins) ins.onclick=()=>{
    const ref=spReference();
    if(!ref) return;
    const inp=document.getElementById('aiInput');
    if(inp){
      const prefix=`Regarding my setup "${ref}": `;
      inp.value = inp.value ? (prefix+inp.value) : prefix;
      inp.focus();
      inp.style.height='auto'; inp.style.height=Math.min(inp.scrollHeight,140)+'px';
      inp.setSelectionRange(inp.value.length, inp.value.length);
    }
  };
}

function msgHTML(m){
  if(m.role==='user') return `<div class="msg user">${esc(m.text)}</div>`;
  if(m.role==='err') return `<div class="msg err">${esc(m.text)}</div>`;
  return `<div class="msg ai"><div class="who">Bono</div>${m.streaming&&!m.text?`<span class="typing"><span></span><span></span><span></span></span>`:esc(m.text)}${m.stopped?'<span class="stopped">Stopped</span>':''}</div>`;
}

function aiStop(){ const b=AI(); if(b && typeof b.stop==='function') b.stop(); }

function aiSendMsg(text){
  const bridge=AI();
  if(!bridge||aiBusy) return;
  aiMessages.push({role:'user',text});
  const aiMsg={role:'ai',text:'',streaming:true};
  aiMessages.push(aiMsg);
  aiBusy=true;
  renderAI();

  const finish=()=>{ aiMsg.streaming=false; aiBusy=false; renderAI(); };
  let settled=false;
  // Extra background for Bono (decoded AC Evo values). It rides along with the question but is
  // never shown in the chat.
  const context=(typeof aiEvoContext==='function')?aiEvoContext(text):'';

  try{
    const ret=bridge.send(text,{
      allowWrite:aiAllowWrite,
      context,
      onChunk:(t)=>{ aiMsg.text+=t; if(mode==='ai'){ const l=document.getElementById('chatLog'); renderAI(); } },
      onDone:(full)=>{ if(settled) return; settled=true; if(typeof full==='string'&&full) aiMsg.text=full; finish(); },
      onStopped:(full)=>{ if(settled) return; settled=true;
        if(typeof full==='string'&&full) aiMsg.text=full;
        aiMsg.streaming=false; aiBusy=false;
        if(aiMsg.text.trim()) aiMsg.stopped=true;                       // keep what Bono had said so far
        else{ const i=aiMessages.indexOf(aiMsg); if(i>0) aiMessages.splice(i-1,2); }   // nothing came back: drop the exchange
        aiDraft=text;                                                    // question back in the box, selected, ready to edit
        if(mode==='ai') renderAI(); },
      onError:(msg)=>{ if(settled) return; settled=true; aiMessages.pop(); aiMessages.push({role:'err',text:msg||'Something went wrong talking to Claude Code.'}); aiBusy=false; aiMsg.streaming=false; renderAI(); }
    });
    // Fallback: send() returned a Promise of the full reply instead of streaming
    if(ret && typeof ret.then==='function'){
      ret.then(full=>{ if(settled) return; settled=true; if(typeof full==='string') aiMsg.text=full; finish(); })
         .catch(e=>{ if(settled) return; settled=true; aiMessages.pop(); aiMessages.push({role:'err',text:(e&&e.message)||'Request failed.'}); aiBusy=false; renderAI(); });
    }
  }catch(e){
    settled=true; aiMessages.pop();
    aiMessages.push({role:'err',text:(e&&e.message)||'Could not start the request.'});
    aiBusy=false; renderAI();
  }
}

function setMode(m){ mode=m; buildNav(); render(); }
function select(id){
  cur=id; dir='up'; mode='params';
  buildNav(); render();
  main.scrollIntoView({behavior:'smooth',block:'start'});
}
function selectSym(id){
  curS=id;
  buildNav(); render();
  main.scrollIntoView({behavior:'smooth',block:'start'});
}

buildNav(); render();
</script>
